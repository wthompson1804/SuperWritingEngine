<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamia's Short Version</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* One phone-width column. Questions one per screen, then a vertical list of the places that fit, a place opened
   as a full sheet, and one bar fixed at the bottom (My list and Compare) on every screen once she saves anything.
   Same pink daytime-TV set as the long page. */
:root{
  --paper:#FFF4F7; --card:#FFFFFF; --ink:#3A1630; --muted:#7A5670;
  --berry:#E0457B; --berry-deep:#C12C62; --on-berry:#FFFFFF;
  --rose:#FFD3E1; --blush:#FFE7EF; --butter:#FFD86B; --on-butter:#3A1630;
  --mint-ink:#1B6F50; --line:#F3CADA; --track:#EBC3D4;
  --ok-bg:#D9F2E6; --ok-ink:#1B6F50; --mid-bg:#FFF0BF; --mid-ink:#6B4E00; --low-bg:#FFE0DC; --low-ink:#A5342B;
  --shade:rgba(58,22,48,.55);
  --script:"Yellowtail","Brush Script MT",cursive;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1E0F1A; --card:#2C1827; --ink:#FCEBF2; --muted:#D6B8CB;
  --berry:#FF8DB3; --berry-deep:#C12C62; --on-berry:#FFFFFF;
  --rose:#4C2542; --blush:#371B30; --butter:#FFD86B; --on-butter:#3A1630;
  --mint-ink:#8FE0BD; --line:#5B3551; --track:#5B3551;
  --ok-bg:#153F30; --ok-ink:#9BE6C6; --mid-bg:#4A3A0A; --mid-ink:#FFDF85; --low-bg:#4A1F1B; --low-ink:#FFB1A8;
  --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1E0F1A; --card:#2C1827; --ink:#FCEBF2; --muted:#D6B8CB;
  --berry:#FF8DB3; --berry-deep:#C12C62; --on-berry:#FFFFFF;
  --rose:#4C2542; --blush:#371B30; --butter:#FFD86B; --on-butter:#3A1630;
  --mint-ink:#8FE0BD; --line:#5B3551; --track:#5B3551;
  --ok-bg:#153F30; --ok-ink:#9BE6C6; --mid-bg:#4A3A0A; --mid-ink:#FFDF85; --low-bg:#4A1F1B; --low-ink:#FFB1A8;
  --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-wrap:break-word}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
p,ul,ol{margin:0}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.08}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}
[tabindex="-1"]:focus{outline:0}
.wrap{max-width:520px;margin:0 auto;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{display:grid;gap:18px;padding-top:6px;padding-bottom:calc(var(--bar-h,0px) + 28px);min-width:0}
#app>*{min-width:0}

/* top line */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{font-family:var(--script);font-size:25px;line-height:1;color:var(--berry);white-space:nowrap}
.quiet{background:none;border:0;padding:10px 0;min-height:44px;min-width:44px;justify-content:center;font-weight:800;font-size:15px;text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:4px;display:inline-flex;align-items:center;gap:6px}
.quiet.center{justify-content:center;width:100%}
.topbtns{display:flex;gap:16px;align-items:center}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15;text-align:center;text-decoration:none;border-radius:999px;padding:10px 22px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.btn.main{background:var(--berry-deep);border-color:var(--berry-deep);color:var(--on-berry)}
.btn.sm{min-height:48px;font-size:17px;padding:8px 16px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active,.choice:active{transform:translateY(1px)}
.stack{display:grid;gap:12px}
.stack>*{min-width:0}
.kicker{font-family:var(--script);font-size:30px;line-height:1;color:var(--berry)}
.h-big{font-weight:800;font-stretch:82%;font-size:clamp(30px,8.6vw,40px)}
.h-mid{font-weight:800;font-stretch:82%;font-size:clamp(28px,7.6vw,34px)}
.lead{font-size:20px;line-height:1.4}
.h-pick{font-weight:800;font-stretch:82%;font-size:clamp(25px,7vw,30px)}
.muted{color:var(--muted)}
.small{font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:4px 20px}

/* welcome */
.hello{text-align:center;display:grid;gap:16px;padding-top:10px}
.hello .name{font-family:var(--script);font-size:clamp(58px,17vw,84px);line-height:.95;color:var(--berry);transform:rotate(-4deg);display:block}
.hello .tagbox{justify-self:center;font-family:var(--display);font-weight:800;font-stretch:80%;font-size:26px;line-height:1;background:var(--ink);color:var(--paper);padding:6px 16px 9px;border-radius:12px;transform:rotate(1.5deg)}
.steps{list-style:none;padding:0;display:grid;gap:10px;text-align:left}
.steps li{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:600}
.steps b{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--butter);color:var(--on-butter);display:grid;place-items:center;font-family:var(--display);font-weight:800}

/* this or that */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:15px;min-height:24px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--berry)}
.dots i.now{background:none;border:2px solid var(--berry)}
.qnav{display:flex;justify-content:space-between;gap:12px}
.duel{display:grid;gap:0;align-items:stretch}
.pick{display:grid;gap:6px;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:12px 14px 12px;color:var(--ink);font:inherit;line-height:1.3;box-shadow:0 3px 0 var(--berry-deep)}
.pick:active{transform:translateY(2px);box-shadow:0 1px 0 var(--berry-deep)}
.pick .p-top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.pick .p-name{display:block;font-family:var(--display);font-weight:800;font-stretch:84%;font-size:21px;line-height:1.08;text-wrap:balance}
.pick .p-place{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-top:2px}
.pick .p-go{flex:0 0 auto;background:var(--berry-deep);color:var(--on-berry);font-family:var(--display);font-weight:800;font-size:15px;border-radius:999px;padding:5px 12px;white-space:nowrap}
.pick .pair{gap:8px}
.pick .pair>span{display:grid;gap:0;align-content:start}
.pick .pair span>span{display:block;font-size:12px;line-height:1.2}
.pick .pair{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.pick .pair b{font-size:19px;line-height:1.15;color:var(--ink)}
.pf{display:grid;gap:3px}
.pf>span{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:center;font-size:15px;font-weight:600;line-height:1.2}
.pf svg{width:20px;height:20px;color:var(--berry-deep)}
.pf .win{font-weight:800;color:var(--ok-ink)}
.pf .win::after{content:" \2713"}
.p-life{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.35;color:var(--muted);font-weight:600;border-top:2px dotted var(--line);padding-top:7px}
.or{justify-self:center;font-family:var(--script);font-size:28px;line-height:1;color:var(--berry);padding:0 0 4px;margin:0}
@media (min-width:640px){.duel{grid-template-columns:1fr auto 1fr;gap:12px}.or{align-self:center}}

/* the three places */
.area3{display:grid;gap:10px;padding-top:6px}
.a-head{display:flex;align-items:center;gap:12px}
.a-head .num{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:21px}
.a-head h2{font-weight:800;font-stretch:82%;font-size:clamp(24px,7vw,30px)}
.tags{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{background:var(--butter);color:var(--on-butter);font-weight:800;font-size:14px;border-radius:999px;padding:3px 11px}
.because{font-size:17px;line-height:1.4}
.because b,.gives b{font-weight:800}
.gives{font-size:15px;line-height:1.4;color:var(--muted);font-weight:600}
.gives b{color:var(--ink)}
.blist{list-style:none;padding:0;display:grid;gap:12px;margin-top:2px}
.bcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.bcard:first-child{border-color:var(--ink)}
.bcard h3{font-weight:800;font-stretch:86%;font-size:21px}
.mname{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;min-height:44px;display:flex;align-items:center}
.inhood{font-size:14px;font-weight:700;color:var(--muted);margin-top:-8px}
.chips{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{background:var(--blush);color:var(--ink);font-weight:700;font-size:14px;line-height:1.25;border-radius:10px;padding:4px 9px}
.mact{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.heart{min-height:48px;min-width:48px;border:2px solid var(--berry-deep);border-radius:999px;background:var(--card);color:var(--berry-deep);font-weight:800;font-size:16px;padding:6px 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.heart .h{font-size:20px;line-height:1}
.heart[aria-pressed="true"]{background:var(--berry-deep);color:var(--on-berry)}
.brow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:2px solid var(--line);margin-top:2px;padding-top:2px}
.brow .quiet{font-size:15px;text-decoration:none}
.brow .quiet .lb{text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:4px}
.brow .quiet.dim .lb{text-decoration-color:var(--line)}
.brow .quiet .tw{display:inline-block;transition:transform .15s;color:var(--berry-deep)}
.brow .quiet[aria-expanded="true"] .tw{transform:rotate(90deg)}
.brow .quiet.dim{color:var(--muted);text-decoration-color:var(--line)}
.thumbs{list-style:none;padding:0;display:grid;gap:6px}
.thumb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;align-items:baseline;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:7px 12px;min-height:44px;font:inherit;color:var(--ink)}
.thumb b{font-family:var(--display);font-size:16px;line-height:1.15;font-weight:800;min-width:0}
.thumb .f{font-size:13px;font-weight:700;color:var(--muted);text-align:right;white-space:nowrap}
.thumb .m{grid-column:1/-1;font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb .m b{font-family:var(--body);font-size:13.5px;color:var(--ink)}
.whatif{background:var(--card);border:2px dashed var(--berry);border-radius:18px;padding:12px 14px;display:grid;gap:2px}
.whatif p{font-weight:700;font-size:16px;line-height:1.35}
.whatif .quiet{justify-self:start}
.nudged{background:var(--blush);border:2px solid var(--berry);border-radius:18px;padding:12px 14px;display:grid;gap:2px}
.nudged p{font-weight:700;font-size:16px}
.links{display:flex;flex-wrap:wrap;gap:0 20px}
.endblock{display:grid;gap:10px;border-top:2px solid var(--ink);padding-top:16px}
.endblock h2{font-weight:800;font-stretch:84%;font-size:24px}
.none-box{background:var(--low-bg);color:var(--low-ink);border-radius:18px;padding:14px 16px;font-weight:700}
.pline{font-size:14px;font-weight:600;color:var(--muted);line-height:1.35}
.pline b{color:var(--ink);font-variant-numeric:tabular-nums}

/* a place */
.place h1{font-weight:800;font-stretch:82%;font-size:clamp(30px,8.4vw,38px)}
.life{display:grid;gap:12px}
.life h2,.sec-h{font-weight:800;font-stretch:84%;font-size:26px}
.moment{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:6px}
.moment .mt{display:flex;align-items:center;gap:10px}
.moment .mt h3{font-size:19px;font-weight:800}
.moment .ic{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--blush);color:var(--berry-deep);display:grid;place-items:center}
.moment .ic svg{width:20px;height:20px}
.moment p{font-size:17px;line-height:1.4}
.moment b{font-weight:800}
details.src summary{list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:800;color:var(--muted);cursor:pointer}
details.src summary::-webkit-details-marker{display:none}
details.src summary::after{content:"+";font-size:18px;line-height:1}
details.src[open] summary::after{content:"\2212"}
details.src ul{list-style:none;padding:0;display:grid;gap:0;margin-top:-4px}
details.src .link{font-size:15px;display:block;padding:10px 0;min-height:44px;line-height:1.35}
.chk{font-size:14px;font-weight:700;line-height:1.3}
.chk.ok{color:var(--ok-ink)}
.chk.old{color:var(--muted)}
.facts{list-style:none;padding:0;border-top:2px solid var(--line)}
.facts li{padding:10px 0;border-bottom:2px solid var(--line);display:grid;gap:6px}
.frow{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.frow .l{font-weight:800;font-size:15px;color:var(--muted);flex:1 1 0;min-width:0}
.frow .v{flex:0 0 auto;max-width:62%;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:22px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.frow .v small:not(.in){white-space:normal}
.frow .v small.in{display:inline;margin:0 0 0 6px}
.frow .v small{display:block;font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted);margin-top:3px}
@media (max-width:360px){.brand{font-size:21px}.top .quiet{font-size:14px}.frow .v{font-size:20px}}
.ftext{font-size:17px;font-weight:600;line-height:1.35}
.pos{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--muted)}
.pos .track{position:relative;flex:1 1 auto;height:6px;border-radius:3px;background:var(--track)}
.pos .track i{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--berry-deep);border:3px solid var(--card)}
.pos .word{flex:0 0 auto;min-width:9.2em;text-align:right}
.link{font-weight:800;font-size:17px;text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:4px;display:inline-flex;align-items:center;min-height:44px}
details.more{border-top:2px solid var(--line)}
details.more:last-of-type{border-bottom:2px solid var(--line)}
details.more summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;font-family:var(--display);font-weight:800;font-size:18px;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:26px;line-height:1;font-weight:500}
details.more[open] summary::after{content:"\2212"}
details.moreqs{margin-top:10px;border-bottom:0!important}
details.more .in{padding:2px 0 16px;display:grid;gap:12px;font-size:17px}
.moregroup{display:grid}
.points{list-style:none;padding:0;display:grid;gap:10px}
.points li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.points svg{width:24px;height:24px;margin-top:1px}
.day{list-style:none;padding:0;display:grid;gap:12px}
.day li{display:grid;gap:3px}
.day .t{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:800}
.chip{flex:0 0 auto;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px}
.chip.strong{background:var(--ok-bg);color:var(--ok-ink)}
.chip.mixed{background:var(--mid-bg);color:var(--mid-ink)}
.chip.weak{background:var(--low-bg);color:var(--low-ink)}
.apts{list-style:none;padding:0;display:grid;gap:12px}
.apts li{border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:6px}
.apts .a-h{font-weight:800}
.apts .a-s{font-size:15px;color:var(--muted);font-weight:600}
.pair{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:10px}
.pair div{display:grid;gap:1px;align-content:start}
.pair span{font-size:13px;font-weight:800;color:var(--muted);line-height:1.2}
.pair b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.star{color:var(--mid-ink);background:var(--mid-bg);border-radius:10px;padding:5px 10px;font-size:15px;font-weight:700;justify-self:start}
.qs{padding-left:1.15em;display:grid;gap:8px}

/* my list */
.saved{list-style:none;padding:0;display:grid;gap:12px}
.srow{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;display:grid;gap:8px}
.srow.on{border-color:var(--ink)}
.tickl{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;min-height:48px;cursor:pointer}
.tickl input{width:28px;height:28px;margin:0;accent-color:#C12C62}
.tickl b{font-family:var(--display);font-size:20px;line-height:1.15;display:block}
.tickl small{display:block;font-size:14px;font-weight:700;color:var(--muted)}
.sact{display:grid;grid-template-columns:1fr auto;gap:10px}
.sact .btn{font-size:16px}
.ontour{color:var(--ok-ink);font-weight:800;font-size:15px}
.tickmsg{min-height:1.4em;font-weight:800;font-size:16px;color:var(--low-ink)}

/* compare */
.cmp{display:grid;gap:0;border-top:2px solid var(--ink)}
.chead,.cells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.chead{padding:10px 0;border-bottom:2px solid var(--ink)}
.chead b{font-family:var(--display);font-size:16px;line-height:1.15;font-weight:800;display:block}
.chead small{display:block;font-size:12px;font-weight:700;color:var(--muted);line-height:1.2;margin-top:2px}
.crow{padding:8px 0 10px;border-bottom:2px solid var(--line);display:grid;gap:4px}
.crow .cl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.cells>div{font-size:14px;font-weight:700;line-height:1.3;min-width:0}
.cells .big{font-family:var(--display);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.cells .best{color:var(--ok-ink)}
.choose .btn{min-height:52px;font-size:15px;padding:6px 8px;line-height:1.15}
.cmp-n3 .cells>div{font-size:13px}
.cmp-n3 .cells .big{font-size:16px}
.cmp-n3 .chead b{font-size:15px}

/* plan */
.area{display:grid;gap:12px}
.area-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.area-h h2{font-weight:800;font-stretch:85%;font-size:24px}
.area-h span{font-weight:800;font-size:15px;color:var(--muted);white-space:nowrap}
.stop{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px}
.stop h3{font-weight:800;font-size:22px}
.stop .lab{color:var(--muted)}
.stop .phone{font-weight:800;user-select:all;-webkit-user-select:all}
.confirmrow{background:var(--blush);border-radius:16px;padding:14px;display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* everything */
.filter{background:var(--butter);color:var(--on-butter);border:2px solid var(--ink);border-radius:22px;padding:16px;display:grid;gap:14px}
.filter h2{font-weight:800;font-size:22px}
.filter label,.filter .lab{font-weight:800;font-size:16px;display:block;color:var(--on-butter);letter-spacing:0;text-transform:none}
.filter output{font-family:var(--display);font-size:20px}
.filter input[type=range]{width:100%;height:44px;margin:0;accent-color:#C12C62}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:6px}
.seg button{min-height:46px;border:2px solid #3A1630;border-radius:999px;background:#FFFFFF;color:#3A1630;font-weight:800;font-size:15px;line-height:1.1;padding:4px 6px}
.seg button[aria-pressed="true"]{background:#3A1630;color:#FFFFFF}
.filter :focus-visible{outline-color:#3A1630}
.check{display:flex!important;align-items:center;gap:12px;min-height:44px}
.check input{width:26px;height:26px;accent-color:#C12C62;flex:0 0 auto}
.fcount{font-weight:800;font-size:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:999px;padding:3px;background:var(--card)}
.tabs button{min-height:44px;border:0;border-radius:999px;background:none;font-weight:800;font-size:16px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grp{display:grid;gap:8px}
.grp-h{font-weight:800;font-size:19px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;scroll-margin-top:12px}
.grp-h{flex-direction:column;align-items:flex-start!important;gap:2px!important}
.grp-h>span{display:flex;align-items:center;gap:8px;min-width:0}
.grp-h small{white-space:normal!important}
.grp-h .rk{flex:0 0 auto;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:15px;margin-right:4px}
.grp-h small{font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.nearby{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-top:4px}
.row{display:grid;gap:4px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;min-height:64px}
.row .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .r1 b{font-family:var(--display);font-size:19px;line-height:1.15}
.row .r1 span{font-size:14px;font-weight:800;color:var(--muted);white-space:nowrap}
.row .r2{font-size:15px;font-weight:600;color:var(--muted);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.row .r2 b{color:var(--ink);font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.row .tag{font-size:13px;font-weight:800}
.row .tag.k{color:var(--berry-deep)}
.row .tag.at{color:var(--muted)}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:18px;text-align:center;font-weight:700}
.mapwrap .hhm-chips{grid-template-columns:1fr}
.mapwrap{--ink:#3A1630;--muted:#7A5670;--line:#F3CADA;--paper:#FFF4F7;--white:#FFFFFF;background:#FFF4F7;color:#3A1630;border:2px solid var(--line);border-radius:20px;padding:10px}

/* the bar, the sheets, the toast */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:2px solid var(--ink);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.savebar .btn{min-height:50px;font-size:17px;padding:6px 12px}
.savebar .btn .h{color:var(--berry-deep);font-size:20px;line-height:1}
.savebar .btn.main .h{color:var(--on-berry)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.sheet .wrap{display:grid;gap:16px;padding-top:8px;padding-bottom:calc(var(--bar-h,0px) + 28px)}
.sheet .wrap>*{min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h,0px) + 14px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);font-weight:800;font-size:16px;border-radius:999px;padding:10px 18px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.asksheet{position:fixed;inset:0;z-index:50;background:var(--shade);display:grid;align-items:end}
.askbox{background:var(--paper);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.askin{max-width:520px;margin:0 auto;display:grid;gap:14px}
.askin h2{font-weight:800;font-size:26px}
.sugg{display:grid;gap:8px}
.sugg button{min-height:48px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 14px;font-weight:700;font-size:16px}
.askform{display:grid;grid-template-columns:1fr auto;gap:8px}
.askform input{min-width:0;min-height:52px;border:2px solid var(--ink);border-radius:16px;background:var(--card);color:var(--ink);font:inherit;padding:8px 14px}
.askform .btn{width:auto}
.answer{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:14px 16px;font-size:18px;white-space:pre-wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<script id="recommender-logic">
/* ===================================================================================================================
   RECOMMENDER. Pure functions, no page access. The JS twin of scripts/recommender.py (the reference): the same
   model on the same shipped numbers (buildings[].features, recommender_samples, meta.recommender). Loaded by Node in
   scripts/test_concierge_pick.js, which checks it against every meta.recommender_examples entry: the pairs asked, in
   order, the mean weights, the top three with their buildings, more like this, why, gives up and what would change.
   To get the same doubles as Python: sums that Python does with sum() use the same compensated (Neumaier) sum as
   CPython 3.12+, plain += where Python uses +=, and every compared value is rounded to round_decimals (q) first;
   ties go to the smaller id. Python's round() to a whole number rounds halves to even (pyRound).

   The selection rule follows meta.recommender.algorithm: group score (one building: mean with the set's median),
   eligibility (relevance_floor, relevance_top_share), then MMR among the eligible only (fill by score otherwise).
   model(data)                          the model's numbers; null when the data has no recommender fields
   posterior(M, answers)                pi over samples after her answers [{a, b, choice: "a"|"b"|"either"}]
   nextPair(M, answers, opts)           [a id, b id] (a < b by id), or null when the stop rule says stop.
                                        opts {removed: [ids], extraFrom: n}: with extraFrom, the stop rule gives way to
                                        "up to extra_pairs more after n answers" (the "make a few more choices" link)
   holds(M, answers, opts)              {n, p, stop}: p = the stop probability, the posterior probability that each
                                        sample's best neighborhood (sample_bests) is among the current three
   recommend(M, answers, opts)          {weights, top: [[area, [ids]]], neighborhoods: [{neighborhood_id, name, score,
                                        buildings: [{id, more_like_this}], why_features, why, gives_up_feature,
                                        gives_up, what_would_change}]}; opts {removed, nudge: {feature, direction, factor}}
   play(M, example)                     replays an example's answers: {pairs, rec}
   Not in the reference (the page's own, used only when she sets buildings aside): opts.removed drops buildings from
   every group, pool and list. With nothing removed the result is the reference's.
   =================================================================================================================== */
var ConciergeRec = (function () {
  "use strict";
  var LABEL = { family: "being near Mom and Dad", money: "money left over", room: "room at home", going_out: "going out", green: "a park nearby", parking: "parking" };

  function mins(n) { return n + " minute" + (n === 1 ? "" : "s"); }
  function placesN(n) { return n + " place" + (n === 1 ? "" : "s"); }

    family: "The drive to Mom and Dad isn't known yet", money: "The monthly total isn't known yet; ask on the tour",
    going_out: "Places to eat and drink nearby aren't mapped yet", green: "The nearest park isn't mapped yet" };

      var d = cent.map(function (a) { return cent.map(function (c) { return Math.sqrt(nsum(a.map(function (x, j) { return (x - c[j]) * (x - c[j]); }))); }); });
      var dmax = 0; d.forEach(function (r) { r.forEach(function (x) { if (x > dmax) dmax = x; }); }); dmax = dmax || 1;

  }
  function q(M, x) { return Number(x.toFixed(M.R)); }

    if (M.Z && M.Z[id]) return M.Z[id];

  }
  function utility(M, id, w) { var f = M.F[id], t = []; for (var k = 0; k < M.K; k++) t.push(w[k] * f[k]); return nsum(t); }
  function score(M, id, w) { return utility(M, id, w) * M.sure[id]; }

    var T = M.cfg.temperature, band = M.cfg.either_band, pa = sig((g - band) / T), pb = sig((-g - band) / T);

  }
  function choiceOf(x) { var c = x.choice; return c === "a" || c === "b" ? c : c === x.a ? "a" : c === x.b ? "b" : "either"; }

    G.forEach(function (g) { out[g.id] = top2of3(g.building_ids.map(function (id) { return sc[id]; }).sort(function (a, b) { return b - a; }), med); });

  /* the groups good enough to recommend: the best, and those ranked in the top relevance_top_share (ceil) with

})();

/* ---------- the model, cached on her answers ---------- */
var CACHE = {};

  var r = R.recommend(MODEL, S.answers, { removed: S.removed, nudge: S.nudge }), onScreen = [];
  r.top.forEach(function (t) { onScreen = onScreen.concat(t[1]); });

function pairNow() {

function areaRankOf(id) { var b = BY[id]; if (!b || !CAN) return null; var top = rec().r.top; for (var i = 0; i < top.length; i++) if (top[i][0] === b.area_id) return i + 1; return null; }

/* ---------- the facts, in plain words ---------- */
function raw(b) {
  var r = b.features_raw || {}, f = b.facts || {}, fit = b.fit || {}, ap = b.apartments || [];
  function pick(x, y) { return x !== undefined && x !== null ? x : y; }
  var sq = ap.map(function (a) { return a.sqft; }).filter(isNum);
  return {
    drive: pick(r.drive_min, f.drive_min), total: pick(r.total, f.total_from),
    sqft: pick(r.sqft, pick(fit.sqft_max, sq.length ? Math.max.apply(null, sq) : null)),
    bedroom: pick(r.bedroom, ap.some(function (a) { return a.beds === 1; })),
    studio: ap.some(function (a) { return a.beds === 0; }),
    rest: pick(r.restaurants_10min, fit.restaurants_10min), park: pick(r.park_walk_min, fit.park_walk_min), parkName: pick(r.park_name, fit.park_name),
    pk: pick(r.parking_kind, (f.parking || {}).kind)

}
var PK = { garage: "Garage parking", covered: "Covered parking", lot: "A parking lot", off_street: "Off-street parking", street: "Street parking" };
function factText(b, k) {

  if (k === "room") return (x.bedroom ? "1 bedroom" : x.studio ? "Studio" : "Size") + (isNum(x.sqft) ? ", " + Math.round(x.sqft).toLocaleString("en-US") + " sq ft" : x.bedroom || x.studio ? "" : " not known");
  if (k === "going_out") return isNum(x.rest) ? x.rest + (x.rest === 1 ? " restaurant" : " restaurants") + " in a 10-min walk" : "Restaurants nearby not known";
  if (k === "green") return isNum(x.park) ? "A park " + Math.max(1, Math.round(x.park)) + " min on foot" : "Nearest park not known";
  if (k === "parking") return PK[x.pk] || "Parking not known";

}
/* the same, short enough for a thumbnail */

  if (k === "going_out") return isNum(x.rest) ? x.rest + (x.rest === 1 ? " restaurant" : " restaurants") + " near" : "";
  if (k === "green") return isNum(x.park) ? "Park " + Math.max(1, Math.round(x.park)) + " min walk" : "";

}
/* which of two is better on a fact (for the tick on "this or that"): 1 = a, -1 = b, 0 = same or unknown */

  if (k === "parking") { var v = { garage: 3, covered: 3, carport: 3, off_street: 2, lot: 2, driveway: 2, surface: 2, street: 1 }, p = v[x.pk], q = v[y.pk]; return !p || !q || p === q ? 0 : p > q ? 1 : -1; }

}
