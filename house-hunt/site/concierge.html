<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamia's Short Version</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* One phone-width column. Questions one per screen, then a vertical list of the places that fit, a place opened
   as a full sheet, and one bar fixed at the bottom (My list and Compare) on every screen once she saves anything.
   Same pink daytime-TV set as the long page. */
:root{
  --paper:#FFF4F7; --card:#FFFFFF; --ink:#3A1630; --muted:#7A5670;
  --berry:#E0457B; --berry-deep:#C12C62; --on-berry:#FFFFFF;
  --rose:#FFD3E1; --blush:#FFE7EF; --butter:#FFD86B; --on-butter:#3A1630;
  --mint-ink:#1B6F50; --line:#F3CADA; --track:#EBC3D4;
  --ok-bg:#D9F2E6; --ok-ink:#1B6F50; --mid-bg:#FFF0BF; --mid-ink:#6B4E00; --low-bg:#FFE0DC; --low-ink:#A5342B;
  --shade:rgba(58,22,48,.55);
  --script:"Yellowtail","Brush Script MT",cursive;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1E0F1A; --card:#2C1827; --ink:#FCEBF2; --muted:#D6B8CB;
  --berry:#FF8DB3; --berry-deep:#C12C62; --on-berry:#FFFFFF;
  --rose:#4C2542; --blush:#371B30; --butter:#FFD86B; --on-butter:#3A1630;
  --mint-ink:#8FE0BD; --line:#5B3551; --track:#5B3551;
  --ok-bg:#153F30; --ok-ink:#9BE6C6; --mid-bg:#4A3A0A; --mid-ink:#FFDF85; --low-bg:#4A1F1B; --low-ink:#FFB1A8;
  --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1E0F1A; --card:#2C1827; --ink:#FCEBF2; --muted:#D6B8CB;
  --berry:#FF8DB3; --berry-deep:#C12C62; --on-berry:#FFFFFF;
  --rose:#4C2542; --blush:#371B30; --butter:#FFD86B; --on-butter:#3A1630;
  --mint-ink:#8FE0BD; --line:#5B3551; --track:#5B3551;
  --ok-bg:#153F30; --ok-ink:#9BE6C6; --mid-bg:#4A3A0A; --mid-ink:#FFDF85; --low-bg:#4A1F1B; --low-ink:#FFB1A8;
  --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-wrap:break-word}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
p,ul,ol{margin:0}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.08}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}
[tabindex="-1"]:focus{outline:0}
.wrap{max-width:520px;margin:0 auto;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{display:grid;gap:18px;padding-top:6px;padding-bottom:calc(var(--bar-h,0px) + 28px);min-width:0}
#app>*{min-width:0}

/* top line */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{font-family:var(--script);font-size:25px;line-height:1;color:var(--berry);white-space:nowrap}
.quiet{background:none;border:0;padding:10px 0;min-height:44px;min-width:44px;justify-content:center;font-weight:800;font-size:15px;text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:4px;display:inline-flex;align-items:center;gap:6px}
.quiet.center{justify-content:center;width:100%}
.topbtns{display:flex;gap:16px;align-items:center}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15;text-align:center;text-decoration:none;border-radius:999px;padding:10px 22px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.btn.main{background:var(--berry-deep);border-color:var(--berry-deep);color:var(--on-berry)}
.btn.sm{min-height:48px;font-size:17px;padding:8px 16px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active,.choice:active{transform:translateY(1px)}
.stack{display:grid;gap:12px}
.stack>*{min-width:0}
.kicker{font-family:var(--script);font-size:30px;line-height:1;color:var(--berry)}
.h-big{font-weight:800;font-stretch:82%;font-size:clamp(30px,8.6vw,40px)}
.h-mid{font-weight:800;font-stretch:82%;font-size:clamp(28px,7.6vw,34px)}
.lead{font-size:20px;line-height:1.4}
.h-pick{font-weight:800;font-stretch:82%;font-size:clamp(25px,7vw,30px)}
.h-say{font-weight:800;font-stretch:86%;font-size:clamp(21px,5.8vw,25px);line-height:1.2}
.muted{color:var(--muted)}
.small{font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:4px 20px}

/* welcome */
.hello{text-align:center;display:grid;gap:16px;padding-top:10px}
.hello .name{font-family:var(--script);font-size:clamp(58px,17vw,84px);line-height:.95;color:var(--berry);transform:rotate(-4deg);display:block}
.hello .tagbox{justify-self:center;font-family:var(--display);font-weight:800;font-stretch:80%;font-size:26px;line-height:1;background:var(--ink);color:var(--paper);padding:6px 16px 9px;border-radius:12px;transform:rotate(1.5deg)}
.how{list-style:none;padding:0;display:grid;gap:10px;text-align:left;counter-reset:how}
.how li{counter-increment:how;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-size:17px;line-height:1.4}
.how li::before{content:counter(how);width:30px;height:30px;border-radius:50%;background:var(--butter);color:var(--on-butter);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.how b{font-weight:800}
.steps{list-style:none;padding:0;display:grid;gap:10px;text-align:left}
.steps li{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:600}
.steps b{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--butter);color:var(--on-butter);display:grid;place-items:center;font-family:var(--display);font-weight:800}

/* this or that, between made-up apartments */
.qhead{display:grid;gap:8px}
.qtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:800;font-size:16px}
.qtop .muted{font-size:14px;font-weight:700;text-align:right}
.prog{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.prog i{display:block;height:100%;background:var(--berry);border-radius:4px}
.qnav{display:flex;justify-content:space-between;gap:12px}
.h-pick{font-weight:800;font-stretch:82%;font-size:clamp(25px,7vw,30px)}
.duel{display:grid;gap:0;align-items:stretch}
.apt{display:grid;gap:8px;width:100%;min-height:150px;align-content:start;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:14px 16px 16px;color:var(--ink);font:inherit;box-shadow:0 3px 0 var(--berry-deep)}
.apt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--berry-deep)}
.ap-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-stretch:84%;font-size:24px;line-height:1.1}
.ap-go{flex:0 0 auto;background:var(--berry-deep);color:var(--on-berry);font-size:15px;border-radius:999px;padding:5px 12px;font-stretch:100%}
.ap-n{font-size:15px;font-family:var(--body);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-stretch:100%}
.ap-hl{display:block;font-family:var(--display);font-weight:800;font-stretch:84%;font-size:clamp(23px,6.6vw,27px);line-height:1.1;text-wrap:balance}
.ap-rows{display:grid;gap:8px;border-top:2px dotted var(--line);padding-top:10px}
.ap-row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.ap-t{display:grid;gap:0}
.ap-l{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.ap-row b{font-weight:700;font-size:17px;line-height:1.25}
.ap-row.dn b{color:var(--muted)}
.mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:900;line-height:1}
.mk.up{background:var(--ok-bg);color:var(--ok-ink)}
.mk.dn{background:var(--track);color:var(--muted)}
.ctab{display:grid;gap:0;border:2px solid var(--ink);border-radius:20px;overflow:hidden;background:var(--card)}
.ct-heads{display:grid;grid-template-columns:1fr 1fr}
.ct-pick{display:grid;gap:6px;align-content:start;text-align:left;min-height:120px;padding:12px;background:var(--card);border:0;border-bottom:2px solid var(--ink);font:inherit;color:var(--ink)}
.ct-pick+.ct-pick{border-left:2px solid var(--ink)}
.ct-pick .ap-hl{font-size:19px}
.ct-pick .ap-go{justify-self:start;background:var(--berry-deep);color:var(--on-berry);font-weight:800;font-size:14px;border-radius:999px;padding:4px 10px}
.ct-row{padding:8px 12px 4px;border-top:2px solid var(--line)}
.ct-row:first-of-type{border-top:0}
.ct-l{font-size:13px;font-weight:800;color:var(--muted)}
.ct-cells{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ct-c{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:start;text-align:left;font:inherit;font-size:15px;font-weight:700;line-height:1.25;background:none;border:0;padding:2px 0;color:var(--ink);min-height:44px}
.ct-c.dn{color:var(--muted)}
.ct-cells .mk{width:22px;height:22px;font-size:13px}
.or{justify-self:center;font-family:var(--script);font-size:28px;line-height:1;color:var(--berry);padding:2px 0 6px;margin:0}
.same{font-size:15px;font-weight:600;color:var(--muted);line-height:1.35}
@media (min-width:640px){.duel{grid-template-columns:1fr auto 1fr;gap:12px}.or{align-self:center}}

/* here's what you told me */
.prio{list-style:none;padding:0;display:grid;gap:8px}
.prio li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;min-height:52px}
.prio li:first-child{border-color:var(--ink)}
.prio .pn{width:30px;height:30px;border-radius:50%;background:var(--blush);color:var(--berry-deep);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.prio li:first-child .pn{background:var(--ink);color:var(--paper)}
.prio .pt{font-weight:700;font-size:17px;line-height:1.25}
.prio .pm{display:flex;gap:6px}
.mv{min-width:44px;min-height:44px;border:2px solid var(--ink);border-radius:12px;background:var(--card);font-size:20px;font-weight:800;line-height:1}
.mv:disabled{opacity:.3;cursor:default}

/* the three places */
.intro .fun{font-size:16px;line-height:1.4}
details.rules summary{min-height:40px}
details.rules{margin-top:-4px}
details.src.rules ul.rlist{list-style:disc;padding-left:1.2em;display:grid;gap:4px;margin-top:0;font-size:15px;line-height:1.35}
.tapnote{margin-top:-4px}
details.lean{border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.llist{list-style:none;padding:0;display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;min-height:48px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font:inherit;color:var(--ink)}
.lrow .ll{font-size:15px;font-weight:600;color:var(--muted)}
.lrow b{font-family:var(--display);font-weight:800;font-size:17px;text-align:right}
.lrow .go{font-size:22px;color:var(--berry-deep)}
.pchips{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.mine{display:grid;gap:4px}
.pc{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 10px 2px 3px;font-weight:700;font-size:14px}
.pc b{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px}
.glance{display:grid;gap:2px}
.gl-h{font-family:var(--body);font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.glance table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.glance thead th{font-size:12px;font-weight:800;color:var(--muted);text-align:left;padding:0 4px 4px;vertical-align:bottom;line-height:1.15}
.glance thead th:first-child{width:0;padding:0}
.glance tbody th{text-align:left;padding:4px 0 0;border-top:2px solid var(--line)}
.glance tbody tr:first-child th{border-top:2px solid var(--ink)}
.gl-name{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;background:none;border:0;padding:0;font:inherit;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15;color:var(--ink);text-align:left}
.gl-name .gn{flex:1 1 auto;min-width:0}
.gl-name .go{flex:0 0 auto;font-size:24px;line-height:1;color:var(--berry-deep);padding-right:2px}
.gl-name .num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:14px}
.gl-vals{cursor:pointer}
.gl-vals td{padding:0 4px 8px;font-weight:800;font-size:16px;line-height:1.2;vertical-align:top;white-space:nowrap}
.gl-vals td:first-child{width:0;padding:0}
.gl-vals td small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.gl-vals td.best{color:var(--ok-ink)}
.gl-vals td .bm{margin-right:2px}
.hlist{list-style:none;padding:0;display:grid;gap:8px}
.hcard{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden}
.hcard.open{border-color:var(--ink)}
.hcard h2{margin:0;font-size:inherit}
.hhead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;min-height:56px;text-align:left;background:none;border:0;padding:8px 12px;font:inherit;color:inherit}
.hhead .num{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.hn{display:grid;gap:5px;min-width:0}
.hname{font-family:var(--display);font-weight:800;font-stretch:84%;font-size:clamp(19px,5.4vw,22px);line-height:1.1}
.htags{display:flex;flex-wrap:wrap;gap:6px}
.htags span{background:var(--butter);color:var(--on-butter);font-weight:800;font-size:13px;border-radius:999px;padding:2px 10px}
.hhead .tw{font-size:28px;line-height:1;color:var(--berry-deep);transition:transform .15s}
.hhead[aria-expanded="true"] .tw{transform:rotate(90deg)}
.hbody{display:grid;gap:8px;padding:0 12px 12px}
.because,.gives{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:16px;line-height:1.35;font-weight:600}
.because .mk,.gives .mk{width:22px;height:22px;font-size:13px}
.because b,.gives b{font-weight:800}
.gives{color:var(--muted)}
.plist{list-style:none;padding:0;display:grid;gap:8px}
.prow{display:grid;gap:2px;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font:inherit;color:var(--ink);min-height:44px}
.prow .pr1{display:flex;align-items:center;gap:8px}
.prow .pr1 b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15;min-width:0}
.prow .go{font-size:24px;line-height:1;color:var(--berry-deep)}
.prow .pin{font-size:13px;font-weight:700;color:var(--muted)}
.prow .pr2{font-size:14.5px;font-weight:600;color:var(--muted);line-height:1.35}
.prow .pr2 b{color:var(--ink);font-variant-numeric:tabular-nums}
.prow .ck{flex:0 0 auto;font-size:14px;font-weight:900;margin-left:auto}
.prow .ck.ok{color:var(--ok-ink)}
.prow .ck.old{color:var(--muted)}
.prow .pmn b{color:var(--ink);font-variant-numeric:tabular-nums}
.prow .pf1{font-size:15px;font-weight:700}
.prow .chk{font-size:13px}
.thumbs{list-style:none;padding:0;display:grid;gap:6px}
.thumb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;align-items:baseline;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;min-height:44px;font:inherit;color:var(--ink)}
.thumb b{font-family:var(--display);font-size:16px;line-height:1.15;font-weight:800;min-width:0}
.thumb .f{font-size:13px;font-weight:700;color:var(--muted);text-align:right;white-space:nowrap}
.thumb .m{grid-column:1/-1;font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb .m b{font-family:var(--body);font-size:13.5px;color:var(--ink)}
.mname{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;min-height:44px;display:flex;align-items:center}
.inhood{font-size:14px;font-weight:700;color:var(--muted);margin-top:-8px}
.tags{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{background:var(--butter);color:var(--on-butter);font-weight:800;font-size:14px;border-radius:999px;padding:3px 11px}
.chips{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{background:var(--blush);color:var(--ink);font-weight:700;font-size:14px;line-height:1.25;border-radius:10px;padding:4px 9px}
.mact{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.heart{min-height:48px;min-width:48px;border:2px solid var(--berry-deep);border-radius:999px;background:var(--card);color:var(--berry-deep);font-weight:800;font-size:16px;padding:6px 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.heart .h{font-size:20px;line-height:1}
.heart[aria-pressed="true"]{background:var(--berry-deep);color:var(--on-berry)}
.links{display:flex;flex-wrap:wrap;gap:0 20px}
.endblock{display:grid;gap:10px;padding-top:6px}
.none-box{background:var(--low-bg);color:var(--low-ink);border-radius:18px;padding:14px 16px;font-weight:700}
.pline{font-size:14px;font-weight:600;color:var(--muted);line-height:1.35}
.pline b{color:var(--ink);font-variant-numeric:tabular-nums}

/* a place */
.place h1{font-weight:800;font-stretch:82%;font-size:clamp(30px,8.4vw,38px)}
.life{display:grid;gap:12px}
.life h2,.sec-h{font-weight:800;font-stretch:84%;font-size:26px}
.moment{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:6px}
.moment .mt{display:flex;align-items:center;gap:10px}
.moment .mt h3{font-size:19px;font-weight:800}
.moment .ic{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--blush);color:var(--berry-deep);display:grid;place-items:center}
.moment .ic svg{width:20px;height:20px}
.moment p{font-size:17px;line-height:1.4}
.moment b{font-weight:800}
details.src summary{list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:800;color:var(--muted);cursor:pointer}
details.src summary::-webkit-details-marker{display:none}
details.src summary::after{content:"+";font-size:18px;line-height:1}
details.src[open] summary::after{content:"\2212"}
details.src ul{list-style:none;padding:0;display:grid;gap:0;margin-top:-4px}
details.src .link{font-size:15px;display:block;padding:10px 0;min-height:44px;line-height:1.35}
.chk{font-size:14px;font-weight:700;line-height:1.3}
.chk.ok{color:var(--ok-ink)}
.chk.old{color:var(--muted)}
.facts{list-style:none;padding:0;border-top:2px solid var(--line)}
.facts li{padding:10px 0;border-bottom:2px solid var(--line);display:grid;gap:6px}
