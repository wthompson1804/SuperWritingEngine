<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamia's Short Version</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Version 7. One phone-width column: a ranked list of neighborhood cards, a neighborhood screen (why, know this,
   top buildings, avoid, all buildings), a building screen, and one bar fixed at the bottom (Home, Everything,
   My list). Same pink daytime-TV set as version 6. */
:root{
  --paper:#FFF4F7; --card:#FFFFFF; --ink:#3A1630; --muted:#7A5670;
  --berry:#E0457B; --berry-deep:#C12C62; --on-berry:#FFFFFF;
  --rose:#FFD3E1; --blush:#FFE7EF; --butter:#FFD86B; --on-butter:#3A1630;
  --line:#F3CADA; --track:#EBC3D4;
  --ok-bg:#D9F2E6; --ok-ink:#1B6F50; --mid-bg:#FFF0BF; --mid-ink:#6B4E00; --low-bg:#FFE0DC; --low-ink:#A5342B;
  --avoid-bg:#F2EAEE; --avoid-ink:#6A5563; --avoid-line:#B9A5B1; --water:#FFE7EF; --land:#FFFFFF;
  --script:"Yellowtail","Brush Script MT",cursive;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1E0F1A; --card:#2C1827; --ink:#FCEBF2; --muted:#D6B8CB;
  --berry:#FF8DB3; --berry-deep:#C12C62; --on-berry:#FFFFFF;
  --rose:#4C2542; --blush:#371B30; --butter:#FFD86B; --on-butter:#3A1630;
  --line:#5B3551; --track:#5B3551;
  --ok-bg:#153F30; --ok-ink:#9BE6C6; --mid-bg:#4A3A0A; --mid-ink:#FFDF85; --low-bg:#4A1F1B; --low-ink:#FFB1A8;
  --avoid-bg:#2A2027; --avoid-ink:#C9B6C2; --avoid-line:#7A6672; --water:#1E0F1A; --land:#3A2434;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1E0F1A; --card:#2C1827; --ink:#FCEBF2; --muted:#D6B8CB;
  --berry:#FF8DB3; --berry-deep:#C12C62; --on-berry:#FFFFFF;
  --rose:#4C2542; --blush:#371B30; --butter:#FFD86B; --on-butter:#3A1630;
  --line:#5B3551; --track:#5B3551;
  --ok-bg:#153F30; --ok-ink:#9BE6C6; --mid-bg:#4A3A0A; --mid-ink:#FFDF85; --low-bg:#4A1F1B; --low-ink:#FFB1A8;
  --avoid-bg:#2A2027; --avoid-ink:#C9B6C2; --avoid-line:#7A6672; --water:#1E0F1A; --land:#3A2434;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-wrap:break-word}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
p,ul,ol{margin:0}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.08}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}
[tabindex="-1"]:focus{outline:0}
.wrap{max-width:520px;margin:0 auto;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{display:grid;gap:18px;padding-top:6px;padding-bottom:calc(var(--bar-h,0px) + 28px);min-width:0}
#app>*{min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top line, buttons, type */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.quiet{background:none;border:0;padding:10px 0;min-height:44px;min-width:44px;justify-content:center;font-weight:800;font-size:16px;text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:4px;display:inline-flex;align-items:center;gap:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15;text-align:center;text-decoration:none;border-radius:999px;padding:10px 22px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.btn.main{background:var(--berry-deep);border-color:var(--berry-deep);color:var(--on-berry)}
.btn.soft{background:var(--rose);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.btn.sm{min-height:48px;font-size:17px;padding:8px 16px}
.btn:active{transform:translateY(1px)}
.btn .go{font-size:24px;line-height:1}
.stack{display:grid;gap:12px}
.stack>*{min-width:0}
.kicker{font-family:var(--script);font-size:30px;line-height:1;color:var(--berry)}
.h-big{font-weight:800;font-stretch:82%;font-size:clamp(30px,8.6vw,40px)}
.lead{font-size:20px;line-height:1.4}
.muted{color:var(--muted)}
.small{font-size:15px}
.link{font-weight:800;font-size:17px;text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:4px;display:inline-block;padding:10px 0;min-height:44px;line-height:1.4}
.links{display:flex;flex-wrap:wrap;gap:0 20px}
.sec-h{font-weight:800;font-stretch:84%;font-size:26px}
.sec-h small{font-family:var(--body);font-size:15px;font-weight:700;color:var(--muted);margin-left:6px;font-stretch:100%}
.ic{flex:0 0 auto;border-radius:50%;background:var(--rose);color:var(--berry-deep);display:grid;place-items:center}

/* the logo */
.hello{text-align:center;display:grid;gap:6px;justify-items:center}
.logo{margin:0;display:grid;justify-items:center;width:100%}
.logo svg{display:block;width:min(180px,48%);height:auto;margin:0 auto -14px}
.logo .name{font-family:var(--script);font-weight:400;font-size:clamp(46px,13.4vw,66px);line-height:.98;color:var(--berry);display:block;transform:rotate(-4deg);text-shadow:2px 2px 0 var(--card),4px 4px 0 var(--ink)}
.logo .tagbox{display:inline-block;margin-top:12px;font-family:var(--display);font-weight:800;font-stretch:80%;font-size:24px;line-height:1;background:var(--ink);color:var(--paper);padding:6px 16px 9px;border-radius:12px;transform:rotate(1.5deg)}
.hello .say{font-family:var(--display);font-weight:800;font-stretch:86%;font-size:clamp(24px,6.8vw,30px);line-height:1.15;margin-top:6px}
details.how{width:100%}
details.how summary{list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;font-weight:800;font-size:16px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:4px}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"+";font-size:20px;line-height:1;text-decoration:none}
details.how[open] summary::after{content:"\2212"}
.howbox{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;gap:12px;font-size:17px;line-height:1.45;margin-top:6px}
.howbox h3{font-size:19px;font-weight:800}
.wts{list-style:none;padding:0;display:grid;gap:8px}
.wts li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;font-weight:800;font-size:16px}
.wts li b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.wts .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.wts .bar i{display:block;height:100%;background:var(--berry-deep);border-radius:4px}
.wts small{grid-column:1/-1;font-size:14px;font-weight:700;color:var(--muted)}

/* neighborhood cards */
.ncards{list-style:none;padding:0;display:grid;gap:20px}
.ncard{background:var(--card);border:2px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 5px 0 var(--berry)}
.illus{display:block;border-bottom:2px solid var(--ink);background:var(--blush);line-height:0}
.illus svg{display:block;width:100%;height:84px}
.ncard .nb{display:grid;gap:10px;padding:10px 14px 14px}
.ncard h2{font-weight:800;font-stretch:84%;font-size:clamp(26px,7.4vw,31px);line-height:1.05;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.ncard h2 small{display:block;font-family:var(--body);font-size:16px;font-weight:800;color:var(--muted);font-stretch:100%;margin-top:3px}
.num{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 6px;border-radius:999px;background:var(--berry-deep);color:var(--on-berry);font-family:var(--display);font-weight:800;font-size:19px;font-stretch:100%;font-variant-numeric:tabular-nums}
.tags{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{background:var(--butter);color:var(--on-butter);font-weight:800;font-size:14px;border-radius:999px;padding:3px 11px}
.figs{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.figs li{display:grid;gap:1px;background:var(--paper);border-radius:16px;padding:8px 12px 9px}
.figs b{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.figs b small{font-size:17px;font-weight:800}
.figs span{font-size:14px;font-weight:700;line-height:1.2}
.figs .sub{color:var(--muted);font-size:13px}
.wchips{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.wchips li{display:inline-flex;align-items:center;gap:6px;background:var(--blush);border-radius:999px;padding:3px 12px 3px 3px;font-weight:800;font-size:14px;line-height:1.2}
.wchips .ic{width:26px;height:26px;background:var(--card)}
.wchips .ic svg{width:16px;height:16px}
.conf{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.conf i{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:0 0 auto}
.endblock{display:grid;gap:10px;padding-top:6px;justify-items:center;text-align:center}

/* a neighborhood */
.hero{display:grid;gap:10px}
.hero .illus{border:2px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 5px 0 var(--berry)}
.hero .illus svg{height:auto;aspect-ratio:360/170}
.hero h1{font-weight:800;font-stretch:82%;font-size:clamp(34px,9.6vw,44px);line-height:1}
.hero .where{font-size:17px;font-weight:800;color:var(--muted)}
.why{list-style:none;padding:0;display:grid;gap:12px}
.why li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;font-size:18px;font-weight:600;line-height:1.4}
.why .ic{width:40px;height:40px}
.why .ic svg{width:22px;height:22px}
.know{background:var(--mid-bg);color:var(--mid-ink);border-radius:20px;padding:14px 16px;display:grid;gap:10px}
.know h2{font-size:22px;font-weight:800;font-stretch:84%}
.know ul{list-style:none;padding:0;display:grid;gap:10px}
.know li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:17px;font-weight:600;line-height:1.4}
.know li svg{width:24px;height:24px;margin-top:1px}
.note{font-size:15px;font-weight:700;color:var(--muted)}
.moms{display:grid;gap:10px}
details.mom{background:var(--card);border:2px solid var(--line);border-radius:18px}
details.mom[open]{border-color:var(--ink)}
details.mom summary{list-style:none;display:grid;grid-template-columns:40px minmax(0,1fr) 20px;gap:10px;align-items:center;min-height:64px;padding:10px 12px;cursor:pointer}
details.mom summary::-webkit-details-marker{display:none}
details.mom summary::after{content:"+";font-size:24px;line-height:1;color:var(--berry-deep);font-weight:600}
details.mom[open] summary::after{content:"\2212"}
details.mom .ic{width:40px;height:40px}
details.mom .ic svg{width:22px;height:22px}
details.mom .mt{display:grid;gap:1px;min-width:0}
details.mom .mt b{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15}
details.mom .mt span{font-size:15px;font-weight:600;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
details.mom[open] .mt span{display:none}
details.mom .mb{padding:0 14px 8px;display:grid;gap:2px;font-size:17px;line-height:1.45}
details.mom .link{font-size:15px}

/* building cards */
.bcards{list-style:none;padding:0;display:grid;gap:16px}
.bcard{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:14px 14px 12px;display:grid;gap:10px;box-shadow:0 4px 0 var(--berry)}
.bhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.bname{display:grid;gap:2px;text-align:left;background:none;border:0;padding:0;font:inherit;color:var(--ink);min-height:44px;align-content:center}
.bname b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.12}
.bname b .go{color:var(--berry-deep);margin-left:4px}
.bname small{font-size:14px;font-weight:800;color:var(--ok-ink)}
.heart{min-height:48px;min-width:48px;border:2px solid var(--berry-deep);border-radius:999px;background:var(--card);color:var(--berry-deep);font-weight:800;font-size:16px;padding:6px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.heart .h{font-size:20px;line-height:1}
.heart[aria-pressed="true"]{background:var(--berry-deep);color:var(--on-berry)}
.btn .h{font-size:20px;line-height:1}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px}
.pair.one{grid-template-columns:minmax(0,1fr)}
.pair div{display:grid;gap:1px;align-content:start}
.pair span{font-size:13px;font-weight:800;color:var(--muted);line-height:1.2}
.pair b{font-family:var(--display);font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.count{font-size:15px;font-weight:800}
.kq{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.kq li{font-weight:800;font-size:14px;line-height:1.2;border-radius:999px;padding:4px 11px;border:2px solid transparent}
.kq li.k{background:var(--ok-bg);color:var(--ok-ink)}
.kq li.q{border-color:var(--avoid-line);color:var(--ink);background:none}
.kq-l{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:-4px}
.rating{font-size:15px;font-weight:800}
.tel{font-family:var(--display);font-weight:800;font-size:20px}

/* avoid: flat, grey, dashed, with a cross */
.avoids{list-style:none;padding:0;display:grid;gap:12px}
.avoid{background:var(--avoid-bg);color:var(--avoid-ink);border:2px dashed var(--avoid-line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 12px;align-items:start}
.avoid .x{width:36px;height:36px;border-radius:50%;background:var(--avoid-ink);color:var(--avoid-bg);display:grid;place-items:center;font-weight:900;font-size:20px;line-height:1}
.avoid h3{font-size:19px;font-weight:800;align-self:center}
.avoid p{grid-column:2;font-size:16px;font-weight:600;line-height:1.4}
.avoid .src{font-size:14px;font-weight:700}
.avoid .src a{display:inline-block;padding:13px 0;font-weight:800;text-underline-offset:3px}
.avoid .src{margin-top:-8px}
.sec-avoid{color:var(--avoid-ink)}

/* all buildings, everything, my list rows */
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:56px;background:none;border:0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:8px 0;font-family:var(--display);font-weight:800;font-size:20px;text-align:left}
.toggle::after{content:"+";font-size:26px;line-height:1;font-weight:500}
.toggle[aria-expanded="true"]::after{content:"\2212"}
.rows{list-style:none;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;min-height:60px;box-shadow:0 3px 0 var(--rose);font:inherit;color:var(--ink)}
.row.b{grid-template-columns:minmax(0,1fr) auto}
.row .rk{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.row .nm{display:grid;gap:0;min-width:0}
.row .nm b{font-family:var(--display);font-size:18px;line-height:1.15}
.row .nm small{font-size:14px;font-weight:700;color:var(--muted)}
.row .fg{display:grid;justify-items:end;gap:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .fg b{font-family:var(--display);font-size:18px;line-height:1.15}
.row .fg small{font-size:14px;font-weight:700;color:var(--muted)}
.row .tg{font-size:13px;font-weight:800;color:var(--ok-ink)}
.row .tg.a{color:var(--avoid-ink)}
.row.av{background:var(--avoid-bg);border-style:dashed;border-color:var(--avoid-line);box-shadow:none;color:var(--avoid-ink)}
.hoodnav{display:grid;gap:10px;padding-top:4px}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:18px;text-align:center;font-weight:700}
.search{display:grid;gap:6px}
.search label{font-weight:800;font-size:16px}
.search input{min-height:52px;border:2px solid var(--ink);border-radius:16px;background:var(--card);color:var(--ink);font:inherit;font-size:18px;padding:8px 14px;width:100%}
.fcount{font-weight:800;font-size:16px}
details.filter{background:var(--butter);color:var(--on-butter);border:2px solid var(--ink);border-radius:22px}
details.filter summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:8px 16px;cursor:pointer;font-family:var(--display);font-weight:800;font-size:20px}
details.filter summary::-webkit-details-marker{display:none}
details.filter summary::after{content:"+";font-size:26px;line-height:1;font-weight:500}
details.filter[open] summary::after{content:"\2212"}
details.filter .fsum{flex:1 1 auto;font-family:var(--body);font-size:14px;font-weight:700;text-align:right;min-width:0}
details.filter .fbody{display:grid;gap:14px;padding:0 16px 16px}
.filter label,.filter .lab{font-weight:800;font-size:16px;display:block}
.filter output{font-family:var(--display);font-size:20px}
.filter input[type=range]{width:100%;height:44px;margin:0;accent-color:#C12C62}
.filter :focus-visible{outline-color:#3A1630}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:6px}
.seg button{min-height:46px;border:2px solid #3A1630;border-radius:999px;background:#FFFFFF;color:#3A1630;font-weight:800;font-size:15px;line-height:1.1;padding:4px 6px}
.seg button[aria-pressed="true"]{background:#3A1630;color:#FFFFFF}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:999px;padding:3px;background:var(--card)}
.tabs button{min-height:44px;border:0;border-radius:999px;background:none;font-weight:800;font-size:16px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mapbox{border:2px solid var(--ink);border-radius:20px;overflow:hidden;background:var(--water);line-height:0;touch-action:manipulation;cursor:pointer}
.mapbox svg{display:block;width:100%;height:auto}
.srow{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;display:grid;gap:8px}
.srow h2{font-size:21px;font-weight:800}
.srow .in{font-size:15px;font-weight:700;color:var(--muted)}
.sact{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.confirmrow{background:var(--blush);border-radius:16px;padding:14px;display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* a building */
.place h1{font-weight:800;font-stretch:82%;font-size:clamp(30px,8.4vw,38px)}
.place .kicker{font-size:26px}
.inhood{font-size:15px;font-weight:700;color:var(--muted)}
.chk{font-size:15px;font-weight:800;line-height:1.3;color:var(--ok-ink)}
.photos{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border:2px solid var(--ink);border-radius:999px;background:var(--rose);font-family:var(--display);font-weight:800;font-size:19px;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--ink)}

<script>
(function () {
"use strict";
var D = window.CONCIERGE_DATA, PLACES = window.CONCIERGE_PLACES || {}, MAPBASE = window.HOUSE_HUNT_MAP_BASE || null;

/* ---------- small helpers ---------- */

var ICON = {
  search: "M10 4a6 6 0 1 0 0 12a6 6 0 0 0 0-12zM14.5 14.5L20 20", dog: "M5 11l-2-4 4-1 2 2h5l3-3 2 1-1 4v8h-3v-4H9v4H6v-6z",

function logo() {
  return '<h1 class="logo" tabindex="-1" id="home-h" aria-label="Lamia&#39;s House Hunt, the short version"><svg viewBox="0 0 360 70" aria-hidden="true"><path d="M30 66 180 8 330 66" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="16" width="20" height="34" rx="3" fill="currentColor"/><path d="M180 30c-5-9-19-6-17 4 1 6 9 11 17 17 8-6 16-11 17-17 2-10-12-13-17-4z" fill="#E0457B"/></svg>' +
    '<span class="name" aria-hidden="true">Lamia&#39;s<br>House Hunt</span><span class="tagbox" aria-hidden="true">the short version</span></h1>';

/* ---------- a why fact, shortened to a chip (the full sentence is on the neighborhood screen) ---------- */
var SHORT_LABEL = { near: "Near " + ANCHOR, cost: "Lower rents", going_out: "Places to go out", green: "Parks nearby", supply: "Dogs welcome", space: "More room", parking: "Easier parking" };
function whyChip(w) {

  if (m === "cost") return isNum(f.apartments_2000) ? fmtN(f.apartments_2000) + " at " + money(LIMIT) + " or less" : isNum(f.median_rent) ? "Half ask " + money(f.median_rent) + " or less" : SHORT_LABEL.cost;

function whyList(h) { return arr(h.why).filter(function (w) { return w && str(w.text); }).slice(0, 3); }

/* ---------- home ---------- */
var MEASURE_LABEL = { near: "Near " + ANCHOR, cost: "Rent", going_out: "Going out", green: "Parks and the dog", supply: "Listings that take dogs and skip the stairs", space: "Space", parking: "Parking", records: "Safety" };

  var out = [];

  if (isNum(c.too_little_supply)) out.push(fmtN(c.too_little_supply) + " with too few buildings");
  if (isNum(c.cut_by_the_jamaica_rule)) out.push(fmtN(c.cut_by_the_jamaica_rule) + " that did not pass the safety rule");

    '<li><b>' + (d ? Math.round(h.drive_min) + ' <small>min</small>' : "Not known") + '</b><span>drive to ' + esc(ANCHOR) + '</span>' + (note && toll ? '<span class="sub">' + toll + '</span>' : '') + '</li></ul>';

/* ---------- everything: every ranked neighborhood, searchable ---------- */
function norm(t) { return String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }

N.forEach(function (h) { HAY[h.id] = " " + norm([h.name, h.area, h.state, STATE_NAME[h.state], arr(h.tags_true || h.tags).join(" ")].join(" ")) + " "; });

    if (isNum(f.rent) && RENT_B && f.rent < RENT_B.max && !(isNum(h.typical_rent) && h.typical_rent <= f.rent)) return false;

}

    '<span class="nm"><b>' + esc(h.name) + '</b><small>' + esc(where(h)) + '</small></span>' +
    '<span class="fg"><b' + (isNum(h.typical_rent) ? ' data-rent="' + h.typical_rent + '"' : '') + '>' + (money(h.typical_rent) || "") + '</b><small>' + (driveText(h) ? driveText(h) + " drive" : "") + '</small></span></button></li>';
}
function filterSummary() {

  if (isNum(f.drive) && DRIVE_B && f.drive < DRIVE_B.max) a.push("up to " + f.drive + " min");
  if (isNum(f.rent) && RENT_B && f.rent < RENT_B.max) a.push("up to " + money(f.rent));
