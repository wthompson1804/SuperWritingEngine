<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamia's House Hunt Mock-up 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Same pink daytime-TV set as the House Hunt pages: blush paper, berry pink, plum ink, butter sign, mint for "strong".
     Layout: one phone-width column that runs like an episode. A step bar on top (pick a year, take the tour, compare),
     a labelled "My top three" bar on the bottom, and a guide dog who says what to do next. */
  --paper:#FFF4F7;
  --ink:#3A1630;
  --muted:#7A5670;
  --berry:#E0457B;
  --berry-deep:#C12C62;
  --rose:#FFD3E1;
  --blush:#FFE7EF;
  --butter:#FFD86B;
  --butter-deep:#D9A91A;
  --mint:#3FB98A;
  --mint-ink:#1B6F50;
  --coral-ink:#A5342B;
  --white:#FFFFFF;
  --line:#F3CADA;
  --plum2:#55234A;
  --script:"Yellowtail","Brush Script MT",cursive;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --s5:#3FB98A; --s4:#9AD9A8; --s3:#FFD86B; --s2:#FFA77A; --s1:#F0625A;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-bottom:150px;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
p{margin:0}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
:focus-visible{outline:3px solid var(--butter-deep);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
#view{outline:0}
.stack{display:grid;gap:16px}
.stack.tight{gap:12px}

/* ---------- Top bar (scrolls away) and step bar (stays) ---------- */
.top .wrap{display:flex;align-items:center;gap:8px;min-height:54px}
.brand{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;text-decoration:none;overflow:hidden}
.brand b{font-family:var(--script);font-weight:400;font-size:30px;color:var(--berry);line-height:1}
.brand span{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:17px;white-space:nowrap}
@media (max-width:480px){.brand span{display:none}.brand b{font-size:25px}.pillbtn{padding:0 10px}.top .wrap{gap:6px}}
@media (max-width:389px){.pillbtn .fw{display:none}.pillbtn{padding:0 8px;font-size:13px}.brand b{font-size:23px}}
.pillbtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:44px;border-radius:999px;border:2px solid var(--ink);background:var(--white);padding:0 12px;font-family:var(--display);font-weight:800;font-size:14px}
.pillbtn i{font-style:normal;background:var(--ink);color:var(--white);border-radius:999px;padding:1px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.steps{position:sticky;top:0;z-index:20;background:var(--paper);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.steps .wrap{display:flex;align-items:center;gap:6px;padding-top:6px;padding-bottom:6px}
.back{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--white);display:grid;place-items:center;flex:0 0 auto;padding:0}
.back[hidden]{display:none}
.step{flex:1 1 0;min-width:0;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:2px solid var(--line);background:var(--white);font-family:var(--display);font-weight:800;font-size:13px;line-height:1.05;padding:0 6px;color:var(--muted);text-align:left}
.step i{font-style:normal;flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-size:13px}
.step.on{border-color:var(--ink);background:var(--ink);color:var(--white)}
.step.on i{background:var(--butter)}
.step.ready{border-color:var(--berry-deep);background:var(--berry-deep);color:#fff}
.step.ready i{background:#fff;color:var(--berry-deep)}
.step{font-stretch:85%}
.steps .zoom{align-items:stretch;gap:4px;padding-top:0}
.zoom>a,.zoom>button,.zoom>.todo{flex:1 1 0;min-width:0;min-height:44px;border-radius:14px;border:2px solid var(--ink);background:var(--white);padding:3px 8px;text-align:left;text-decoration:none;display:grid;align-content:center;line-height:1.1}
.zoom small{font-size:11px;font-weight:700;color:var(--muted)}
.zoom b{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:13px;overflow-wrap:anywhere}
.zoom .on{background:var(--ink);color:#fff}
.zoom .on small{color:#F3DDE8}
.zoom .todo{border-style:dashed;border-color:#C9A6BD}
.zoom .todo b{color:var(--berry-deep)}
.zoom .off{opacity:.65}
.zoom .off b{color:var(--muted)}
.zoom .sep{flex:0 0 auto;align-self:center;font-weight:800;color:var(--muted)}
body.hl-tray .tray,body.hl-steps .steps{pointer-events:none}
.crumbs{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:14px;font-weight:700;color:var(--muted);padding-top:10px}
.crumbs a{text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:3px;padding:6px 0}
.crumbs span{padding:6px 0}

/* ---------- Title card ---------- */
.title-card{background:radial-gradient(120% 90% at 50% 0%,#FFC1D6 0%,#FFE1EB 55%,var(--paper) 100%);padding:20px 0 16px;text-align:center;overflow:hidden}
.logo{display:inline-block;max-width:420px;width:100%;padding:0 12px}
.logo svg{display:block;width:min(230px,62%);height:auto;margin:0 auto -12px}
.logo .name{font-family:var(--script);font-size:clamp(62px,19vw,94px);line-height:1;color:var(--berry);display:block;transform:rotate(-5deg);text-shadow:3px 3px 0 var(--white),6px 6px 0 var(--ink)}
.logo .show{display:inline-block;margin-top:8px;font-family:var(--display);font-weight:800;font-stretch:78%;font-size:clamp(24px,7vw,34px);line-height:1;background:var(--ink);color:var(--white);padding:4px 14px 7px;border-radius:12px;transform:rotate(1.5deg)}
.tagline{margin-top:14px;font-weight:800;font-size:19px;padding:0 16px}
.mock{margin-top:12px;background:var(--butter);border:2px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:800;text-align:center}

/* ---------- Sections ---------- */
.sec{margin-top:24px}
.sec h2{font-weight:800;font-stretch:82%;font-size:clamp(28px,7.6vw,38px);line-height:1}
.sec h2 .s{font-family:var(--script);font-weight:400;font-stretch:100%;color:var(--berry);font-size:1.15em;margin-right:6px}
.sec-intro{color:var(--muted);margin:8px 0 12px}
.kicker{font-family:var(--script);font-size:26px;color:var(--berry);line-height:1}
.lab{font-family:var(--display);font-weight:800;font-size:15px;margin:10px 0 6px}

/* ---------- Guide tip ---------- */
.tip{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--ink);border-radius:18px;padding:8px 12px;margin-top:12px;font-weight:700;font-size:15px;line-height:1.3}
.tip svg{flex:0 0 auto;width:34px;height:34px}
.tip b{font-family:var(--display)}
.tip .arr{margin-left:auto;flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--berry-deep);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:19px;line-height:1;animation:nudge 1.2s ease-in-out 3}
@keyframes nudge{50%{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){.tip .arr{animation:none}}
.helper{font-size:14px;font-weight:700;color:var(--muted)}
.minilab{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:-2px}
.mapnote{font-size:13px;font-weight:700;color:var(--muted);padding:4px 8px 6px;text-align:center}
.sec[id]{scroll-margin-top:128px}
.wl small{font-size:12px;font-weight:800;color:var(--muted);align-self:center;margin-right:2px}

/* ---------- How it works, wish list ---------- */
.how{background:var(--white);border:3px solid var(--ink);border-radius:22px;padding:14px;display:grid;gap:10px;box-shadow:5px 5px 0 var(--berry)}
.how h3{font-weight:800;font-size:20px}
.how ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.how li{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:15px;line-height:1.3}
.how li i{font-style:normal;flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--butter);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px}
.how li b{font-family:var(--display);font-weight:800}
.wish{display:flex;flex-wrap:wrap;gap:6px}
.wish span{font-size:14px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--white);border:2px solid var(--ink)}
.wl{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.w{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.w.ok{background:#DDF3E8;color:var(--mint-ink)}
.w.no{background:#FFE9E7;color:var(--coral-ink)}

/* ---------- Chips, badges, buttons ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;font-weight:800;padding:4px 11px;border-radius:999px;background:var(--white);border:2px solid var(--ink);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.chip.yel{background:var(--butter)}
.limchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px;padding:10px;border:2px dashed var(--line);border-radius:18px;background:var(--white);width:100%;text-align:left}
.limchips em{font-style:normal;font-family:var(--display);font-weight:800;font-size:15px;margin-right:2px}
.limchips .chip{border-color:var(--line);background:var(--paper);font-size:13px}
.limchips .chg{margin-left:auto;font-weight:800;font-size:14px;text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:3px}
.fit{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;border-radius:999px;padding:5px 12px;background:#DDF3E8;color:var(--mint-ink);font-variant-numeric:tabular-nums}
.fit.zero{background:#FFE3E1;color:var(--coral-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;font-family:var(--display);font-weight:800;font-size:17px;text-decoration:none;border-radius:999px;padding:8px 20px;border:2px solid var(--ink);background:var(--white);text-align:center;line-height:1.1}
.btn.main{background:var(--berry-deep);border-color:var(--berry-deep);color:#fff}
.btn.held{background:var(--mint-ink);border-color:var(--mint-ink);color:#fff}
.btn.held small{display:block;font-family:var(--body);font-size:12px;font-weight:700;color:#D6F0E4;margin-top:2px}
.btn.sm{min-height:44px;font-size:15px;padding:6px 16px}
.btn.wide{width:100%}
.link{background:none;border:0;padding:10px 0;font-weight:800;font-size:15px;text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:3px;min-height:44px}
.x{width:44px;height:44px;border-radius:50%;background:none;border:0;font-size:24px;line-height:1;font-weight:800;flex:0 0 auto}
.bar{display:inline-grid;grid-template-columns:repeat(5,10px);gap:2px;vertical-align:middle}
.bar i{height:10px;border-radius:5px;background:#F6E3EA}
.bar.s5 i{background:var(--s5)}
.bar.s4 i:nth-child(-n+4){background:var(--s4)}
.bar.s3 i:nth-child(-n+3){background:var(--s3)}
.bar.s2 i:nth-child(-n+2){background:var(--s2)}
.bar.s1 i:nth-child(1){background:var(--s1)}
.readybar{display:grid;gap:8px;background:var(--butter);border:3px solid var(--ink);border-radius:20px;padding:12px 14px;margin-top:14px}
.readybar b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15}
.nexts{display:grid;gap:8px;margin-top:22px}

/* ---------- Art and photos ---------- */
.art{position:relative;background:#FFE7EF;border-bottom:2px solid var(--line)}
.art>svg{display:block;width:100%;height:auto}
.art[data-act]{cursor:pointer}
.art.round{border:2px solid var(--line);border-radius:22px;overflow:hidden}
.photos{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:8px;min-height:44px;border-radius:999px;border:2px solid var(--ink);background:var(--white);padding:0 14px 0 12px;font-family:var(--display);font-weight:800;font-size:15px;box-shadow:3px 3px 0 var(--berry)}
.photos svg{width:20px;height:20px;flex:0 0 auto}

/* ---------- Day tiles ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:5px;display:inline-block}
.sw.s,.t-s{background:#DDF3E8;border:2px solid var(--mint)}
.sw.m,.t-m{background:#FFF3C9;border:2px solid var(--butter-deep)}
.sw.y,.t-y{background:var(--white);border:2px solid var(--ink)}
.sw.u,.t-u{background:var(--paper);border:2px dashed #C9A6BD}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:8px;align-items:center;text-align:left;border-radius:16px;padding:8px 8px 8px 10px;min-height:60px}
.tile::after{content:"›";grid-column:3;grid-row:1 / span 2;font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--muted)}
.tile .ti{grid-row:1 / span 2;width:28px;height:28px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line)}
.tile .ti svg{width:18px;height:18px}
.tile .tl{font-size:12px;font-weight:700;color:var(--muted);line-height:1.1}
.tile b{font-family:var(--display);font-weight:800;font-stretch:82%;font-size:15px;line-height:1.1;overflow-wrap:anywhere}
.t-u b{color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.mini span{height:30px;border-radius:9px;display:grid;place-items:center}
.mini svg{width:16px;height:16px}

/* ---------- Year cards ---------- */
.life{display:block;text-decoration:none;background:var(--white);border:3px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:5px 5px 0 var(--berry)}
.life .body{padding:12px 16px 16px;display:grid;gap:8px}
.life .tag{font-weight:800;color:var(--berry-deep);font-size:15px}
.life h3{font-weight:800;font-stretch:80%;font-size:clamp(28px,8vw,34px);line-height:.98}
.life .catch{font-size:15px;color:var(--muted)}
.life .catch b{color:var(--ink)}
.life .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.life .enter{font-family:var(--display);font-weight:800;font-size:17px;background:var(--berry-deep);color:#fff;border-radius:999px;padding:8px 16px}
.life.none{box-shadow:none;border-color:var(--line)}
.life.none .art{opacity:.45;filter:grayscale(.8)}
.hero{background:var(--white);border:3px solid var(--ink);border-radius:26px;overflow:hidden}
.hero .body{padding:12px 16px 16px;display:grid;gap:6px}
.hero h1{font-weight:800;font-stretch:80%;font-size:clamp(30px,8.6vw,40px);line-height:.96}
.tiles3{display:grid;gap:8px}
.t3{background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px}
.t3 small{display:block;color:#F3DDE8;font-weight:700;font-size:13px}
.t3 b{display:block;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.t3 span{display:block;color:#F3DDE8;font-size:14px;margin-top:2px}
.map{background:var(--white);border:2px solid var(--line);border-radius:22px;padding:8px}
.map svg{display:block;width:100%;height:auto;max-width:340px;margin:0 auto}
.map text{font-family:var(--body);font-weight:800}
.hood{display:grid;gap:8px;text-decoration:none;background:var(--white);border:2px solid var(--ink);border-radius:20px;padding:12px 14px}
.hood .hd{display:flex;align-items:center;gap:10px}
.pinl{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px}
.hood h4{font-weight:800;font-stretch:85%;font-size:21px;line-height:1.05}
.hood small{color:var(--muted);font-weight:700}
.hood .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hood .enter{font-family:var(--display);font-weight:800}

/* ---------- Neighborhood and place ---------- */
.two{display:grid;gap:10px}
.panel{border-radius:18px;padding:12px 14px}
.panel h4{font-weight:800;font-size:18px}
.panel ul{margin:4px 0 0;padding-left:20px}
.panel li{margin:3px 0}
.love{background:#E7F7EF}
.pause{background:#FFE9E7}
.unit{background:var(--white);border:2px solid var(--ink);border-radius:22px;padding:12px 14px;display:grid;gap:10px}
.unit .row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.unit h4{font-weight:800;font-stretch:85%;font-size:22px;line-height:1.05}
.unit small{color:var(--muted);font-weight:700}
.unit .acts{display:flex;flex-wrap:wrap;gap:8px}
.unit .acts .btn{flex:1 1 140px}
.unit.out{border-style:dashed;border-color:#D9B7C6;background:#FCF6F8}
.unit.out .dim{opacity:.55}
.why{font-size:14px;font-weight:700;color:var(--coral-ink);background:#FFE9E7;border-radius:12px;padding:7px 10px}
.sign{flex:0 0 auto;text-align:center;position:relative;padding-top:14px}
.sign::before{content:"";position:absolute;top:0;left:50%;width:4px;height:16px;background:var(--ink);transform:translateX(-50%)}
.sign .board{background:var(--butter);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;min-width:104px;transform:rotate(2deg)}
.sign small{display:block;font-weight:800;font-size:11px;color:var(--ink)}
.sign strong{display:block;font-family:var(--display);font-weight:800;font-size:25px;line-height:1;font-variant-numeric:tabular-nums}
.sign em{display:block;font-style:normal;font-size:11px;font-weight:700}
details.receipt{border:2px dashed var(--ink);border-radius:16px;padding:2px 14px;font-variant-numeric:tabular-nums}
details.receipt summary{font-weight:800;min-height:44px;display:flex;align-items:center;cursor:pointer}
details.receipt div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-weight:600}
details.receipt .tot{border-top:2px solid var(--ink);margin-top:4px;padding:6px 0 8px;font-weight:800}
.voice{font-size:18px;line-height:1.45}
.ask{background:var(--paper);border:2px dashed var(--line);border-radius:18px;padding:12px 16px}
.ask b{font-family:var(--display);font-weight:800;font-size:18px}
.ask ul{margin:6px 0 0;padding-left:20px}

/* ---------- The decision ---------- */
.names{display:grid;gap:8px}
.name{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--ink);border-radius:16px;padding:6px 6px 6px 12px}
.name div{flex:1;min-width:0}
.name b{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1}
.name small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.num{flex:0 0 auto;min-width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:#fff}
.n0{background:var(--berry-deep)}.n1{background:var(--ink)}.n2{background:var(--mint-ink)}
.pairbox{background:var(--ink);color:#fff;border-radius:22px;padding:16px;display:grid;gap:10px;margin-top:14px}
.pairbox h3{font-family:var(--script);font-weight:400;font-size:32px;line-height:1;color:#FF9EC0}
.pairbox p{font-size:18px;line-height:1.4}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;border-radius:999px;border:2px solid #8A5C7E;background:none;color:#fff;font-family:var(--display);font-weight:800;font-size:15px;padding:0 14px}
.seg button[aria-pressed="true"]{background:#FF9EC0;border-color:#FF9EC0;color:var(--ink)}
.feel{background:var(--butter);border:2px solid var(--ink);border-radius:20px;padding:12px 14px;margin-top:12px}
.feel b{font-family:var(--display);font-weight:800;font-size:18px}
.feel ul{margin:6px 0 0;padding-left:20px}
.feel li{margin:4px 0}

<script>
(function(){
"use strict";

/* ================= Invented data. No real places, buildings or people. ================= */
var CAP=2800;
var STORY={"close":{"blurb":"Your own keys, ten minutes from the kitchen you grew up in.","hero":"You know these streets already: which bakery sells out by nine, which block floods when it rains. The apartment is small and entirely yours, and Sunday dinner is a short drive, not a trip.","catchT":"Small rooms, street parking","catchL":"You pay city prices for a studio, and the car sleeps wherever you can find a spot.","m":{"work":["Your desk sits by the one window that gets morning light. By noon you have walked to the corner for a coffee and a pork bun, and the woman at the counter knows your order.","I thought I'd feel like I never left home. It turns out ten minutes is plenty of distance.","Priya, moved out of her parents' place last spring"],"dog":["The block is busy until late, so you are never the only one out. You do two loops under the streetlights and wave at the same neighbor walking the same bulldog.","There are always people around. I like that more than I like quiet.","Marisol, has a terrier mix"],"sat":["Friends are a short ride away and the night ends when you want it to. Then you circle for parking: ten minutes on a good night, twenty-five on a bad one.","I love the neighborhood and I hate looking for a spot after eleven. Both are true.","Dev, drives a small car on purpose"],"sun":["You leave at 1:40 for a two o'clock lunch. If your mom needs something on a Wednesday, you are there before the kettle boils.","My dad drops off soup. I didn't ask for the soup. I'd miss the soup.","Priya"]}},"garden":{"blurb":"A quiet courtyard, a bedroom with a door, and a parking spot with your number on it.","hero":"Two-story brick buildings set around lawns, built for people who drive. Nothing here is trying to impress you. It is calm, it is green, and your car is thirty steps from your door.","catchT":"Quiet after nine","catchL":"The nearest place with a line out the door is a fifteen-minute drive.","m":{"work":["You take calls with the window open and hear a lawnmower, not a siren. At lunch you walk the loop path with the dog and eat on a bench.","I get more done here than I ever did in the city. It's almost suspicious.","Hannah, works in payroll software"],"dog":["The paths are lit and the gate is closed. You pass two other dog owners, and by October you know the dogs' names before the people's.","I walk at ten at night and don't think twice. That was the whole point of moving.","Renee, has a corgi"],"sat":["You drive to dinner in the next town and split a ride home if there's wine. Your spot is waiting, under a light, with nobody's bumper in it.","Nobody has ever taken my space. Not once in three years.","Marcus"],"sun":["Half an hour on roads you could drive asleep, with no bridge and no toll. You are home before dark with leftovers on the passenger seat.","It's far enough that I call first. It's close enough that I always go.","Hannah"]}},"tower":{"blurb":"The eleventh floor of a new building, in a small city that has just woken up.","hero":"A front desk signs for your packages and the garage is under the building. Downstairs there is a ramen place, a climbing gym and a bar with trivia on Tuesdays. Everyone in the elevator moved here in the last two years, same as you.","catchT":"Fees stack up","catchL":"The rent is fair. The garage, the amenity fee and the pet rent arrive on top of it.","m":{"work":["You start in the apartment and move to the co-working lounge on six when you want people around. Someone always brings a dog to the lounge.","I met most of my friends in that lounge, pretending to work.","Tobi, product designer"],"dog":["You take the elevator down, cross one lit street, and you are at the riverwalk dog run. The lobby attendant says goodnight to the dog by name.","Having someone at the desk at night matters more than I expected.","Elena, has a mini poodle"],"sat":["Everything is a walk, so the car never moves. You come home through a lobby, not a parking lot.","Fob in the garage, fob in the elevator, fob at my door. My mother has finally stopped asking.","Elena"],"sun":["Forty-five minutes and one bridge. You learn which lane to be in and what the toll costs, and you stop noticing both.","The toll annoys me every single time, and then my mom makes rice and I forget.","Tobi"]}},"beach":{"blurb":"A boardwalk at the end of your street and salt on the car by Friday.","hero":"Summer is loud and winter is yours. From October to May the town belongs to the people who live here: the boardwalk is empty at seven in the morning, and the bartender has time to talk.","catchT":"Two towns in one","catchL":"July is crowded and parking is a fight. February is beautiful, and half the restaurants are closed.","m":{"work":["You open the laptop after a boardwalk walk, with sand still in the dog's paws. On slow afternoons you work from the café that faces the water.","I take my eleven o'clock call from a bench looking at the ocean. Nobody at work knows.","Jo, account manager"],"dog":["In the off-season you have the boardwalk lights and the sound of the water. In summer there are crowds until midnight, which is its own kind of safe.","Winter nights are dark and empty out here. I love it. My sister wouldn't.","Camille, has a lab mix"],"sat":["Three bars, one of them good, all of them walkable. From June on you do not move the car on a Saturday, because your spot will be gone.","Locals have a rule. Park Friday, walk until Monday.","Jo"],"sun":["An hour, sometimes more behind the beach traffic in summer. Coming home, you smell the water before you see it.","My parents think it's far. Then they visit in June and stay till Tuesday.","Camille"]}},"river":{"blurb":"A main street with a bookshop, hills behind it, and the most space your money buys.","hero":"An old mill town that artists and young families found a decade ago. Your apartment has high ceilings and a second room you can't quite name yet. On Saturday the farmers' market takes over the square.","catchT":"A real drive home","catchL":"Your parents are an hour to nearly two away, and you will feel it on a Sunday night.","m":{"work":["The second room becomes an office with a door that closes. At three you walk to the bakery, and the trail along the river starts behind it.","I have a room just for work. In the city that room was my bed.","Noor, grant writer"],"dog":["Main Street is closed up by nine and the sidewalks are yours. It is quiet the way small towns are quiet, with porch lights and one car every few minutes.","It's safe and it's very dark. I bought a good flashlight and a reflective leash.","Abby, has a rescue hound"],"sat":["There is one wine bar, one brewery and a music night at the old firehouse. You know people at all three by spring, and you park in front of your own building.","It's the same forty people every weekend. I didn't expect to like that so much.","Noor"],"sun":["You leave at noon to eat at two. The drive is pretty until the last half hour, and you can't drop by on a weeknight.","I go every other week now, not every week. I stay longer when I go.","Abby"]}},"city":{"blurb":"Everything you could want within six blocks, and a car you barely use.","hero":"The apartment is the smallest on this list and the street is the most alive. You could eat somewhere new every night for a year. The open question is whether the car is a freedom here or a chore.","catchT":"The car is a burden","catchL":"Street parking means moving it twice a week, and a garage costs as much as a car payment.","m":{"work":["Your desk folds away at six because the room is also the living room. You work from three different cafés in a week and never repeat a lunch.","My apartment is tiny, so the neighborhood is my living room. That's the deal.","Imani, copywriter"],"dog":["The sidewalks are full at nine and still busy at midnight. The dog run is two blocks away and has its own social scene.","I've never once been alone on my street at night. Loud, sure. Alone, never.","Sofia, has a frenchie"],"sat":["You walk to dinne function skyBits(){return '<circle cx="540" cy="36" r="20" fill="#FFD86B"/><ellipse cx="80" cy="34" rx="40" ry="12" fill="#fff"/><ellipse cx="108" cy="27" rx="26" ry="10" fill="#fff"/>'}
function bld(x,base,w,h,c,roof){
  var y=base-h,o='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" fill="'+c+'"/>';
  var cols=Math.max(1,Math.floor((w-10)/22)),rows=Math.max(1,Math.floor((h-16)/22)),ox=(w-cols*22+8)/2;
  for(var r=0;r<rows;r++)for(var k=0;k<cols;k++)o+='<rect x="'+(x+ox+k*22)+'" y="'+(y+10+r*22)+'" width="14" height="11" rx="2" fill="#FFF8E1"/>';
  if(roof==="peak")o+='<path d="M'+(x-8)+' '+(y+3)+' L'+(x+w/2)+' '+(y-22)+' L'+(x+w+8)+' '+(y+3)+'z" fill="#3A1630"/>';
  else o+='<rect x="'+(x-4)+'" y="'+(y-7)+'" width="'+(w+8)+'" height="9" rx="3" fill="#3A1630"/>';
  return o}
function tree(x,base){return '<rect x="'+(x-3)+'" y="'+(base-16)+'" width="6" height="16" fill="#3A1630"/><circle cx="'+x+'" cy="'+(base-32)+'" r="20" fill="#3FB98A"/>'}
function car(x,base){return '<rect x="'+x+'" y="'+(base-22)+'" width="70" height="16" rx="6" fill="#E0457B"/><path d="M'+(x+12)+' '+(base-22)+'l8-14h26l10 14z" fill="#E0457B"/><circle cx="'+(x+17)+'" cy="'+(base-5)+'" r="7" fill="#3A1630"/><circle cx="'+(x+53)+'" cy="'+(base-5)+'" r="7" fill="#3A1630"/>'}
function dog(x,base){return '<g transform="translate('+x+','+(base-28)+')"><ellipse cx="22" cy="14" rx="18" ry="9" fill="#C68B59"/><circle cx="40" cy="6" r="8" fill="#C68B59"/><rect x="8" y="18" width="5" height="10" fill="#C68B59"/><rect x="30" y="18" width="5" height="10" fill="#C68B59"/><path d="M4 10 0 2" stroke="#C68B59" stroke-width="4" stroke-linecap="round"/><circle cx="43" cy="4" r="1.6" fill="#3A1630"/></g>'}
function post(x,g,ch){return '<line x1="'+x+'" y1="'+(g-44)+'" x2="'+x+'" y2="'+g+'" stroke="#3A1630" stroke-width="4"/><rect x="'+(x-13)+'" y="'+(g-66)+'" width="26" height="24" rx="5" fill="#FFD86B" stroke="#3A1630" stroke-width="3"/><text x="'+x+'" y="'+(g-48)+'" text-anchor="middle" font-size="16" font-weight="800" fill="#3A1630" font-family="Figtree, sans-serif">'+ch+'</text>'}
/* Where the car sleeps, drawn so the parking type reads at a glance. */
function parkScene(p,x,g){var o="",k;
  if(p==="Garage"||p==="Paid garage"){o+='<rect x="'+x+'" y="'+(g-62)+'" width="108" height="62" rx="4" fill="#3A1630"/><rect x="'+(x+9)+'" y="'+(g-46)+'" width="90" height="46" fill="#7A5670"/>'+car(x+19,g);if(p==="Paid garage")o+=post(x+128,g,"$")}
  else if(p==="Gated lot"){o+='<rect x="'+(x-6)+'" y="'+(g-3)+'" width="124" height="7" fill="#D9C7D0"/>'+car(x+18,g);for(k=0;k<7;k++)o+='<line x1="'+(x+k*18)+'" y1="'+(g-42)+'" x2="'+(x+k*18)+'" y2="'+g+'" stroke="#3A1630" stroke-width="4"/>';o+='<line x1="'+(x-4)+'" y1="'+(g-30)+'" x2="'+(x+112)+'" y2="'+(g-30)+'" stroke="#3A1630" stroke-width="4"/>'}
  else if(p==="Driveway"){o+='<rect x="'+x+'" y="'+(g-3)+'" width="100" height="7" fill="#D9C7D0"/>'+car(x+14,g)}
  else if(p==="Lot"||p==="Paid lot"){o+='<rect x="'+x+'" y="'+(g-3)+'" width="96" height="7" fill="#D9C7D0"/>'+car(x+8,g)+post(x+112,g,p==="Paid lot"?"$":"P")}
  else{o+=car(x+10,g+38)}
  return o}
function ground(g){return '<rect x="0" y="'+g+'" width="600" height="20" fill="#9AD9A8"/><rect x="0" y="'+(g+20)+'" width="600" height="30" fill="#8E7A88"/><path d="M0 '+(g+35)+'h600" stroke="#fff" stroke-width="3" stroke-dasharray="22 16"/>'}
function homes(L,g){var c=L.color;
  if(L.id==="close")return bld(40,g,84,74,"#F2A2B8","peak")+bld(132,g,84,88,"#C9B6A6","peak")+bld(224,g,84,74,"#B79CD9","peak");
  if(L.id==="garden")return bld(40,g,250,62,c,"peak");
  if(L.id==="tower")return bld(110,g,110,118,c,"flat")+bld(40,g,62,70,"#C9B6A6","flat");
  if(L.id==="beach")return bld(40,g,100,62,c,"peak")+bld(154,g,120,84,"#F2A2B8","flat");
  if(L.id==="river")return bld(40,g,74,56,c,"flat")+bld(120,g,74,70,"#FFD86B","flat")+bld(200,g,74,56,"#F2A2B8","flat");
  return bld(40,g,60,104,"#C9B6A6","flat")+bld(108,g,64,124,c,"flat")+bld(180,g,60,92,"#6FA8DC","flat")+bld(248,g,56,112,"#B79CD9","flat")}
function backdrop(L,g){
  if(L.id==="beach")return '<rect x="430" y="'+(g-44)+'" width="170" height="44" fill="#7CC8F2"/><path d="M446 '+(g-26)+'q12-7 24 0t24 0 24 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>';

function lifeArt(L){var g=150;return '<svg viewBox="0 0 600 200" role="img" aria-label="Illustration for '+esc(L.name)+'">'+skyBits()+backdrop(L,g)+ground(g)+homes(L,g)+tree(360,g)+tree(430,g)+dog(480,g+18)+'</svg>'}
function hoodArt(H){var g=150,p=HOODTXT[H.id].park[0];return '<svg viewBox="0 0 600 200" role="img" aria-label="'+esc(H.name)+', where the car sleeps in '+esc(PARK_PHRASE[p])+'">'+skyBits()+backdrop(H.life,g)+ground(g)+homes(H.life,g)+parkScene(p,328,g)+tree(500,g)+dog(540,g+18)+'</svg>'}
function unitArt(U){var g=150,fh=Math.min(U.floors,5),bw=U.floors<=3?220:150;return '<svg viewBox="0 0 600 200" role="img" aria-label="'+esc(U.name)+', where the car sleeps in '+esc(PARK_PHRASE[U.park])+'">'+skyBits()+ground(g)+bld(70,g,bw,fh*22+26,U.life.color,U.floors<=3?"peak":"flat")+parkScene(U.park,328,g)+tree(500,g)+dog(540,g+18)+'</svg>'}

  o+='<g transform="translate('+(cx-13)+','+(cy-14)+')"><path d="M2 12 13 2l11 10v13H2z" fill="#3A1630"/><path d="M13 13.5c-1.4-2.6-5.4-1.6-4.8 1.2.4 1.7 2.6 3.1 4.8 4.8 2.2-1.7 4.4-3.1 4.8-4.8.6-2.8-3.4-3.8-4.8-1.2z" fill="#FF9EC0"/></g>';

/* ================= Shared pieces ================= */
function tip(text){return '<p class="tip">'+IC.pup+'<span>'+text+'</span><i class="arr" aria-hidden="true">↓</i></p>'}

function legend(){return '<div class="legend" aria-label="What the tile colors mean"><span><i class="sw s"></i>Strong</span><span><i class="sw m"></i>Mixed</span><span><i class="sw y"></i>Your call</span><span><i class="sw u"></i>Not known yet</span></div>'}

function mini(H){var d=dayOfHood(H);return '<div class="mini" role="img" aria-label="A day here: '+d.map(function(x){return x.t+" "+TINT_WORD[x.tint]}).join(", ")+'">'+d.map(function(x){return '<span class="t-'+x.tint+'">'+IC[x.k]+'</span>'}).join("")+'</div>'}
function limLine(n,total,what){

function wishLine(U){var miss=wish(U).filter(function(w){return !w.ok}).map(function(w){return w.t.toLowerCase()});

  else if(act==="pair"){var p=t.getAttribute("data-p").split("-"),y2=window.scrollY;S.pair=[+p[0],+p[1]];renderView();window.scrollTo(0,y2)}
  else if(act==="copy"){var st=document.getElementById("copyStatus"),txt=tourText();
    var fb=function(){try{var ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");document.body.removeChild(ta);st.textContent=ok?"Copied":"Copying is blocked here."}catch(err){st.textContent="Copying is blocked here."}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){st.textContent="Copied"},fb)}else fb()}catch(err){fb()}}
});
document.addEventListener("change",function(e){if(e.target&&e.target.id==="ties"){var y=window.scrollY;S.hideTies=e.target.checked;renderView();window.scrollTo(0,y)}});
limsheet.addEventListener("input",function(e){var k=e.target&&e.target.getAttribute("data-k");if(!k)return;S.lim[k]=+e.target.value;save();renderCounts();var y=window.scrollY;renderView();window.scrollTo(0,y)});
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;
  if(S.tourAt>-1)showTour(-1);else if(sheet.classList.contains("open"))closeSheet();else if(limsheet.classList.contains("open"))openLimits(false)});
window.addEventListener("hashchange",function(){var r=location.hash.replace(/^#/,"")||"lives";if(r!==current){closeSheet();go(r)}});

syncSliders();renderCounts();renderTray();
go((function(){try{return location.hash.replace(/^#/,"")}catch(e){return ""}})()||"lives");
if(!S.seenTour)showTour(0);
})();
</script>
