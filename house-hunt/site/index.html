<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamia's House Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Pink daytime-TV set: blush paper, berry pink, plum ink, butter sign, mint for "strong".
     One phone-width column: a back line on top, a labelled "My top three" bar on the bottom. */
  --paper:#FFF4F7;
  --ink:#3A1630;
  --muted:#7A5670;
  --berry:#E0457B;
  --berry-deep:#C12C62;
  --rose:#FFD3E1;
  --blush:#FFE7EF;
  --butter:#FFD86B;
  --butter-deep:#D9A91A;
  --mint:#3FB98A;
  --mint-ink:#1B6F50;
  --coral-ink:#A5342B;
  --white:#FFFFFF;
  --line:#F3CADA;
  --plum2:#55234A;
  --script:"Yellowtail","Brush Script MT",cursive;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --s5:#3FB98A; --s4:#9AD9A8; --s3:#FFD86B; --s2:#FFA77A; --s1:#F0625A;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-bottom:calc(var(--tray-h,140px) + 20px);-webkit-text-size-adjust:100%;overflow-wrap:break-word}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
p{margin:0}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
.tray :focus-visible,.pairbox :focus-visible,.t3 :focus-visible{outline-color:var(--butter)}
.wrap{max-width:560px;margin:0 auto;padding-top:0;padding-bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{outline:0}
.stack{display:grid;gap:16px}
.stack.tight{gap:12px}
.stack>*{min-width:0}

/* ---------- Title card ---------- */
.title-card{background:radial-gradient(120% 90% at 50% 0%,#FFC1D6 0%,#FFE1EB 55%,var(--paper) 100%);padding:24px env(safe-area-inset-right,0px) 12px env(safe-area-inset-left,0px);text-align:center;overflow:hidden}
.logo{display:inline-block;max-width:420px;width:100%;padding:0 12px}
.logo svg{display:block;width:min(190px,52%);height:auto;margin:0 auto -12px}
.logo .name{font-family:var(--script);font-size:clamp(54px,16vw,84px);line-height:1;color:var(--berry);display:block;transform:rotate(-5deg);text-shadow:3px 3px 0 var(--white),6px 6px 0 var(--ink)}
.logo .show{display:inline-block;margin-top:8px;font-family:var(--display);font-weight:800;font-stretch:78%;font-size:clamp(24px,7vw,34px);line-height:1;background:var(--ink);color:var(--white);padding:4px 14px 7px;border-radius:12px;transform:rotate(1.5deg)}
.tagline{margin-top:14px;font-weight:800;font-size:19px;padding:0 16px}
.coldopen{max-width:30em;margin:8px auto 0;padding:0 20px;font-size:16px;line-height:1.4}
.coldopen b{font-family:var(--display)}
.mock{margin-top:10px;background:var(--butter);border:2px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:13px;font-weight:800;text-align:center}

/* ---------- Sections ---------- */
.sec{margin-top:24px}
.sec h2{font-weight:800;font-stretch:82%;font-size:clamp(28px,7.6vw,38px);line-height:1}
.sec h2 .s{font-family:var(--script);font-weight:400;font-stretch:100%;color:var(--berry);font-size:1.15em;margin-right:6px}
.kicker{font-family:var(--script);font-size:26px;color:var(--berry);line-height:1}
.lab{font-family:var(--display);font-weight:800;font-size:15px;margin:10px 0 6px}
.lead{font-size:17px;margin-top:8px}
.sec[id]{scroll-margin-top:72px}

/* ---------- Guide tip ---------- */
.tip{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--ink);border-radius:18px;padding:8px 12px;margin-top:12px;font-weight:700;font-size:15px;line-height:1.3}
.tip svg{flex:0 0 auto;width:34px;height:34px}
.tip b{font-family:var(--display)}
.tip .arr{margin-left:auto;flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--berry-deep);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:19px;line-height:1;animation:nudge 1.2s ease-in-out 3}
@keyframes nudge{50%{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){.tip .arr{animation:none}*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.helper{font-size:14px;font-weight:700;color:var(--muted)}
.mapnote{font-size:13px;font-weight:700;color:var(--muted);padding:4px 8px 6px;text-align:center}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;font-family:var(--display);font-weight:800;font-size:17px;text-decoration:none;border-radius:999px;padding:8px 20px;border:2px solid var(--ink);background:var(--white);text-align:center;line-height:1.1}
.btn.main{background:var(--berry-deep);border-color:var(--berry-deep);color:#fff}
.btn.held{background:var(--mint-ink);border-color:var(--mint-ink);color:#fff}
.btn.held small{display:block;font-family:var(--body);font-size:12px;font-weight:700;color:#D6F0E4;margin-top:2px}
.btn.sm{min-height:44px;font-size:15px;padding:6px 16px}
.btn.wide{width:100%}
.link{background:none;border:0;padding:10px 0;font-weight:800;font-size:15px;text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:3px;min-height:44px}
a.link{display:inline-flex;align-items:center}
.x{width:44px;height:44px;border-radius:50%;background:none;border:0;font-size:24px;line-height:1;font-weight:800;flex:0 0 auto}
.readybar{display:grid;gap:8px;background:var(--butter);border:3px solid var(--ink);border-radius:20px;padding:12px 14px;margin-top:14px}

/* ---------- Art and photos ---------- */
.art{position:relative;background:#FFE7EF;border-bottom:2px solid var(--line)}
.art>svg{display:block;width:100%;height:auto}
.art.round{border:2px solid var(--line);border-radius:22px;overflow:hidden}
.photos{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:8px;min-height:44px;border-radius:999px;border:2px solid var(--ink);background:var(--white);padding:0 14px 0 12px;font-family:var(--display);font-weight:800;font-size:15px;box-shadow:3px 3px 0 var(--berry);text-decoration:none}
.photos svg{width:20px;height:20px;flex:0 0 auto}

/* ---------- Day tiles ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:5px;display:inline-block}
.sw.s,.t-s{background:#DDF3E8;border:2px solid var(--mint)}
.sw.m,.t-m{background:#FFF3C9;border:2px solid var(--butter-deep)}
.sw.y,.t-y{background:var(--white);border:2px solid var(--ink)}
.sw.u,.t-u{background:var(--paper);border:2px dashed #C9A6BD}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:8px;align-items:center;text-align:left;border-radius:16px;padding:8px 8px 8px 10px;min-height:60px}
.tile::after{content:"›";grid-column:3;grid-row:1 / span 2;font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--muted)}
.tile .ti{grid-row:1 / span 2;width:28px;height:28px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line)}
.tile .ti svg{width:18px;height:18px}
.tile .tl{font-size:12px;font-weight:700;color:var(--muted);line-height:1.1}
.tile b{font-family:var(--display);font-weight:800;font-stretch:82%;font-size:15px;line-height:1.1;overflow-wrap:anywhere}
.t-u b{color:var(--muted)}

/* ---------- Year cards ---------- */
.life{display:block;text-decoration:none;background:var(--white);border:3px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:5px 5px 0 var(--berry)}
.life .body{padding:12px 16px 16px;display:grid;gap:8px}
.life .tag{font-weight:800;color:var(--berry-deep);font-size:15px}
.life h3{font-weight:800;font-stretch:80%;font-size:clamp(28px,8vw,34px);line-height:.98}
.life .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.life.none{box-shadow:none;border-color:var(--line)}
.life.none .art{opacity:.45;filter:grayscale(.8)}
.life.none .body>*:not(.foot){opacity:.6}
.hero{background:var(--white);border:3px solid var(--ink);border-radius:26px;overflow:hidden}
.hero .body{padding:12px 16px 16px;display:grid;gap:6px}
.hero h1{font-weight:800;font-stretch:80%;font-size:clamp(30px,8.6vw,40px);line-height:.96}
.hero .btn.wide{margin-top:6px}
.tiles3{display:grid;gap:8px}
.t3{background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px}
.t3 small{display:block;color:#F3DDE8;font-weight:700;font-size:13px}
.t3 b{display:block;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.t3 span{display:block;color:#F3DDE8;font-size:14px;margin-top:2px}
.hood{display:grid;gap:7px;text-decoration:none;background:var(--white);border:2px solid var(--ink);border-radius:20px;padding:12px 14px}
.hood .hd{display:flex;align-items:center;gap:10px}
.hood .hd>div{min-width:0}
.pinl{flex:0 0 auto;min-width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px}
.hood h4{font-weight:800;font-stretch:85%;font-size:21px;line-height:1.05}
.hood small{color:var(--muted);font-weight:700}
.hood .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:2px}
.hood .foot .facts{flex:1 1 150px;min-width:0;text-align:left}
.life .foot .facts{text-align:left}
.hood .foot .enter{margin-left:auto}
.hood.none{border-color:var(--line);border-style:dashed}
.hood.none .hd,.hood.none .pull{opacity:.6}
.life .enter,.hood .enter{font-family:var(--display);font-weight:800;font-size:17px;background:var(--berry-deep);color:#fff;border-radius:999px;padding:8px 16px;white-space:nowrap}
.hook{font-family:var(--display);font-weight:800;font-stretch:88%;font-size:19px;line-height:1.15;color:var(--berry-deep)}
.pull{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:16px;line-height:1.3}
.pull li{display:flex;gap:9px;align-items:baseline}
.pull li::before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--berry);transform:translateY(-1px)}
.snag{font-size:15px;color:var(--muted)}
.snag b{color:var(--ink)}
.facts{font-size:14.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.limline{font-size:14.5px;font-weight:700;color:var(--muted);margin:12px 0;line-height:1.4}
.limline b{color:var(--ink)}
.limline .link{display:inline-block;padding:12px 0;min-height:44px;font-size:14.5px;color:var(--ink)}
.slot-text{font-size:17px;line-height:1.45}
.slot-text+.slot-text{margin-top:8px}

/* ---------- Top three, then more on demand ---------- */
.pick{display:inline-block;white-space:nowrap;justify-self:start;font-family:var(--display);font-weight:800;font-size:13px;line-height:1.2;border-radius:999px;padding:3px 12px;background:var(--berry-deep);color:#fff}
.pick.n{background:var(--ink);min-width:28px;text-align:center}
.hood.pickc,.unit.pickc{border-width:3px;box-shadow:4px 4px 0 var(--berry)}
.hood.pickc.none{box-shadow:none}
.morectl{display:grid;gap:4px;justify-items:center;margin-top:14px;text-align:center}
.morectl .facts{color:var(--ink)}
.listhd{font-family:var(--display);font-weight:800;font-size:16px;margin:10px 0 0}
/* ---------- The host's voice: one speech style, apart from facts and from resident quotes ---------- */
.host{background:var(--rose);border:3px solid var(--ink);border-radius:22px 22px 22px 6px;padding:10px 14px 12px;display:grid;gap:6px;overflow-wrap:anywhere}
.host>*{min-width:0}
.host .who{display:flex;align-items:center;gap:8px;font-family:var(--script);font-size:25px;line-height:1;color:var(--berry-deep)}
.host .who svg{width:30px;height:30px;flex:0 0 auto}
.host p{font-size:17px;line-height:1.45}
.host.sm p{font-size:15.5px;line-height:1.4}
.host.sm .who{font-size:22px}
.host .hcatch{border-top:2px dashed var(--ink);padding-top:6px}
.host .hcatch b{font-family:var(--display)}
.quote.desc{background:var(--white);border:2px solid var(--line)}
.contact{background:var(--white);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;display:grid;gap:6px;justify-items:start}
.contact h4{font-weight:800;font-size:18px}
.contact p{font-size:15.5px}
.contact .telrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.contact .tel{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;-webkit-user-select:all;user-select:all;overflow-wrap:anywhere}

/* ---------- Neighborhood and place ---------- */
.two{display:grid;gap:10px}
.panel{border-radius:18px;padding:12px 14px}
.panel h4{font-weight:800;font-size:18px}
.panel ul{margin:4px 0 0;padding-left:20px}
.panel li{margin:3px 0}
.love{background:#E7F7EF}
.pause{background:#FFE9E7}
.panel .quote{background:rgba(255,255,255,.65)}
.unit{background:var(--white);border:2px solid var(--ink);border-radius:22px;padding:12px 14px;display:grid;gap:10px}
.unit>*{min-width:0}
.unit .row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.unit .row>div:first-child{min-width:0}
.unit h4{font-weight:800;font-stretch:85%;font-size:22px;line-height:1.05;overflow-wrap:anywhere}
.unit small{color:var(--muted);font-weight:700}
.unit .acts{display:flex;flex-wrap:wrap;gap:8px}
.unit .acts .btn{flex:1 1 140px;padding:8px 12px;font-size:16px}
.unit.out{border-style:dashed;border-color:#D9B7C6;background:#FCF6F8}
.unit.out .dim{opacity:.55}
.unit.avoid{border-color:var(--coral-ink);background:#FFF6F5}
.unit.avoid h4{font-size:20px}
.badge{display:inline-block;font-family:var(--display);font-weight:800;font-size:13px;border-radius:999px;padding:2px 10px;background:var(--coral-ink);color:#fff}
.why{font-size:14px;font-weight:700;color:var(--coral-ink);background:#FFE9E7;border-radius:12px;padding:7px 10px}
.sign{flex:0 0 auto;max-width:48%;text-align:center;position:relative;padding-top:14px}
.sign strong.nk{font-size:17px;line-height:1.1}
.sign::before{content:"";position:absolute;top:0;left:50%;width:4px;height:16px;background:var(--ink);transform:translateX(-50%)}
.sign .board{background:var(--butter);border:3px solid var(--ink);border-radius:14px;padding:6px 10px;min-width:104px;transform:rotate(2deg)}
.sign small{display:block;font-weight:800;font-size:11px;color:var(--ink)}
.sign strong{display:block;font-family:var(--display);font-weight:800;font-size:25px;line-height:1;font-variant-numeric:tabular-nums}
.sign em{display:block;font-style:normal;font-size:11px;font-weight:700}
.sign.plain .board{background:var(--white);transform:none;border-width:2px}
.receipt{background:var(--ink);color:#fff;border-radius:18px;padding:10px 14px 6px;font-variant-numeric:tabular-nums}
.receipt .tot{border-top-color:#8A5C7E!important}
.receipt .fn,.receipt .howb{color:#F3DDE8!important}
.receipt .howb b,.receipt .howd[open]>summary,.receipt a{color:#fff}
.receipt .ln{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-weight:600}
.receipt .ln span:first-child{min-width:0}
.receipt .ln small{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.receipt .ln span:last-child{flex:0 0 auto;white-space:nowrap}
.receipt .tot{border-top:2px solid var(--ink);margin-top:4px;padding:6px 0 4px;font-weight:800}
.receipt .fn{font-size:13px;font-weight:700;color:var(--muted);padding:2px 0 8px}
.terms{background:var(--butter);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;display:grid;gap:6px}
.terms h4{font-weight:800;font-size:18px}
.terms dl{margin:0;display:grid;gap:4px;font-size:15px}
.terms dt{font-weight:800;font-size:13px}
.terms dd{margin:0 0 4px}
.terms blockquote{margin:0;padding:8px 10px;background:rgba(255,255,255,.6);border-radius:12px;font-size:14.5px;overflow-wrap:anywhere}
.call{display:inline-block;font-family:var(--display);font-weight:800;font-size:14px;background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;justify-self:start}
.capwarn{background:#FFE9E7;border:2px solid var(--coral-ink);color:var(--coral-ink);border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px}
.voice{font-size:18px;line-height:1.45}
.amen{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.amen>li{display:flex;gap:12px;align-items:flex-start}
.amen>li>div{min-width:0;flex:1 1 auto}
.amen .ai{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--white);border:2px solid var(--line);display:grid;place-items:center}
.amen .ai svg{width:22px;height:22px}
.amen>li>div>b{display:block;font-family:var(--display);font-weight:800;font-size:16px;line-height:1.2}
.amen>li>div>span{display:block;font-size:16px;line-height:1.3}
.rules{margin:6px 0 0;padding-left:18px;font-size:15px;line-height:1.35}
.rules li{margin:6px 0}
.rules b{font-family:var(--display);font-weight:800}
.amen .fold{margin-top:8px;padding:2px 12px}
.amen .fold summary{font-size:15px}
.notfound{font-size:15px;font-weight:700;color:var(--muted);margin-top:4px}
/* one thing still to confirm */
.conf{display:inline-block;font-family:var(--display);font-weight:800;font-size:13px;line-height:1.2;border-radius:12px;padding:3px 10px;background:var(--butter);border:2px solid var(--ink);margin-top:6px;max-width:100%;overflow-wrap:anywhere}
/* the full asterisk text on a card: what is still to confirm, and why */
.confl{overflow-wrap:anywhere;font-size:14.5px;line-height:1.35;background:#FFF3C9;border:2px solid var(--ink);border-radius:14px;padding:7px 10px}
.confl b{font-family:var(--display);font-weight:800}
.confl+.confl{margin-top:-4px}
.rentl{font-size:14.5px;line-height:1.35;font-weight:600;border-left:4px solid var(--butter-deep);padding:2px 0 2px 10px}
.rentl b{font-weight:800}
.callitem .confl b,.callitem .rentl b{font-size:inherit;line-height:inherit}
.copybox{width:100%;min-height:180px;font:inherit;font-size:14px;line-height:1.35;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--paper);color:var(--ink)}
.cstar{font-family:var(--display);font-weight:800;color:var(--berry-deep);margin-left:2px}
.confnote{font-size:15px;font-weight:700;margin-top:10px;background:var(--white);border:2px dashed var(--ink);border-radius:14px;padding:8px 12px;line-height:1.35}
.confbox{background:var(--white);border:2px dashed var(--ink);border-radius:18px;padding:12px 14px;display:grid;gap:6px}
.confbox{overflow-wrap:anywhere}
.confbox>*{min-width:0}
.confbox h4{font-weight:800;font-size:18px}
.confbox blockquote{margin:0;padding:8px 10px;background:var(--paper);border-radius:12px;font-size:15px;overflow-wrap:anywhere}
.confbox p{font-size:15px}
.confbox.park{border-style:solid;border-color:var(--butter-deep);background:#FFF9E3}
.confline{font-size:14px;font-weight:700}
.vtheme{font-family:var(--display);font-weight:800;font-size:18px;margin-top:14px}
.quote.pos{border-left:5px solid var(--mint)}
.quote.neg{border-left:5px solid var(--s1)}
.fold{background:var(--white);border:2px dashed var(--line);border-radius:18px;padding:6px 14px}
.fold summary{font-family:var(--display);font-weight:800;font-size:17px;cursor:pointer;min-height:44px;display:flex;align-items:center}
.fold ul{margin:6px 0 8px;padding-left:20px}
.fold li{margin:4px 0}
.callbox{background:var(--blush);border:2px dashed var(--berry);border-radius:20px;padding:12px 14px;display:grid;gap:10px}
.callbox h3{font-weight:800;font-stretch:85%;font-size:22px}
.callitem{background:var(--white);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.callitem b{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.15}
.callitem ul{margin:2px 0 0;padding-left:20px;font-size:15px}
.upnext{display:grid;gap:4px;text-decoration:none;background:var(--blush);border:2px dashed var(--berry);border-radius:20px;padding:12px 14px;margin-top:24px}
.upnext small{font-family:var(--script);font-size:23px;color:var(--berry);line-height:1.05}
.upnext b{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:22px;line-height:1.05}
.upnext span{font-size:16px;line-height:1.3}
.upnext em{font-style:normal;justify-self:end;font-family:var(--display);font-weight:800;font-size:17px;color:var(--berry-deep)}
.quote{background:var(--paper);border-radius:14px;padding:10px 12px;font-size:15px;margin-top:10px;overflow-wrap:anywhere}
.quote small{display:block;color:var(--muted);font-weight:700;margin-top:4px;line-height:1.5}
.srcl{font-weight:800;text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:3px;display:inline;padding:16px 4px;overflow-wrap:anywhere}

/* ---------- The decision ---------- */
.names{display:grid;gap:8px}
.name{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--ink);border-radius:16px;padding:6px 6px 6px 12px}
.name div{flex:1;min-width:0}
.name a{display:block;padding:13px 0 7px}
.name small{padding-bottom:8px}
.name b{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1}
.name small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.num{flex:0 0 auto;min-width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:#fff}
.n0{background:var(--berry-deep)}.n1{background:var(--ink)}.n2{background:var(--mint-ink)}
.pairbox{background:var(--ink);color:#fff;border-radius:22px;padding:16px;display:grid;gap:10px;margin-top:14px}
.pairbox h3{font-family:var(--script);font-weight:400;font-size:32px;line-height:1;color:#FF9EC0}
.pairbox p{font-size:18px;line-height:1.4}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;border-radius:999px;border:2px solid #8A5C7E;background:none;color:#fff;font-family:var(--display);font-weight:800;font-size:15px;padding:0 14px}
.seg button[aria-pressed="true"]{background:#FF9EC0;border-color:#FF9EC0;color:var(--ink)}
.feel{background:var(--butter);border:2px solid var(--ink);border-radius:20px;padding:12px 14px;margin-top:12px}
.feel b{font-family:var(--display);font-weight:800;font-size:18px}
.feel ul{margin:6px 0 0;padding-left:20px}
.feel li{margin:4px 0}
.cmp-head{position:sticky;top:58px;z-index:10;background:var(--paper);padding:10px 0 8px;margin-top:8px}
.cols{display:grid;gap:8px}
.cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.colh{display:flex;align-items:center;gap:6px;background:var(--butter);border:2px solid var(--ink);border-radius:14px;padding:5px 8px;min-width:0}
.colh .pr{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums;min-width:0}
.rowc{background:var(--white);border:2px solid var(--line);border-radius:18px;padding:10px;display:grid;gap:8px}
.rowc h4{font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center;line-height:1.15}
.rowc h4 svg{width:20px;height:20px;flex:0 0 auto}
.rowc h4 em{font-style:normal;margin-left:auto;font-family:var(--body);font-size:12px;font-weight:800;color:var(--muted);background:var(--paper);border-radius:999px;padding:2px 8px;white-space:nowrap}
.cell{border-radius:12px;padding:8px;background:var(--paper);font-size:14px;font-weight:800;line-height:1.2;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;border:2px solid transparent}
.cell small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.cell.edge,.cell.t-s{background:#DDF3E8;border-color:var(--mint)}
.cell.t-m{background:#FFF3C9;border-color:var(--butter-deep)}
.cell.t-y{background:var(--white);border-color:var(--ink)}
.cell.t-u{background:var(--paper);border:2px dashed #C9A6BD;color:var(--muted)}
.tiesrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:800;font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--berry-deep)}
.tiesrow small{color:var(--muted);font-weight:700}
/* five-point scale against staying in Queens */
.scalekey{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 10px;flex-wrap:wrap}
.pips{display:inline-grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;width:100%;max-width:96px;vertical-align:middle}
.pips i{height:10px;border-radius:5px;background:#F1DCE5}
.pips i:nth-child(3){box-shadow:inset 0 0 0 2px #B58CA5}
.pips.p1 i:nth-child(1){background:var(--s1);box-shadow:inset 0 0 0 2px var(--ink)}
.pips.p2 i:nth-child(2){background:var(--s2);box-shadow:inset 0 0 0 2px var(--ink)}
.pips.p3 i:nth-child(3){background:var(--s3);box-shadow:inset 0 0 0 2px var(--ink)}
.pips.p4 i:nth-child(4){background:var(--s4);box-shadow:inset 0 0 0 2px var(--ink)}
.pips.p5 i:nth-child(5){background:var(--s5);box-shadow:inset 0 0 0 2px var(--ink)}
button.pt{display:grid;gap:4px;align-content:start;text-align:left;min-height:64px;background:var(--paper);border:2px solid var(--line)}
button.pt b{font-family:var(--display);font-weight:800;font-size:14.5px;line-height:1.1}
button.pt small{margin:0}
.ylist{display:grid;gap:6px;margin-top:10px}
.ylist button.pt{grid-template-columns:minmax(0,1fr) 96px;align-items:center;column-gap:10px;min-height:52px;background:var(--white)}
.ylist button.pt .pips{grid-column:2;grid-row:1 / span 2}
.tour-list{margin-top:22px;background:var(--white);border:3px solid var(--ink);border-radius:24px;padding:16px;display:grid;gap:10px;box-shadow:5px 5px 0 var(--berry)}
.tour-list h3{font-weight:800;font-stretch:82%;font-size:28px;line-height:1}
#copyStatus{font-weight:800;color:var(--mint-ink)}
.empty{background:var(--white);border:2px dashed var(--line);border-radius:22px;padding:18px 16px;display:grid;gap:12px;justify-items:start}
.lease{color:var(--ink);font-weight:800;font-size:15px}

/* ---------- My top three (bottom bar) ---------- */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(58,22,48,.25)}
.tray .wrap{padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.tr-text{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tr-text b{font-family:var(--script);font-weight:400;font-size:24px;color:#FF9EC0;line-height:1}
.tr-text span{font-size:14px;font-weight:700;color:#F3DDE8;line-height:1.2}
.tr-row{display:flex;align-items:center;gap:6px}
.slot{flex:1 1 0;min-width:0;height:56px;border-radius:14px;border:2px dashed #8A5C7E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:800;color:#C9A6BD;line-height:1.1;text-decoration:none}
.slot.full{border:0;background:var(--plum2);color:#fff;font-variant-numeric:tabular-nums}
.slot.full b{font-family:var(--display);font-size:15px}
.slot.full em{font-style:normal;font-size:10.5px;font-weight:700;color:#E3C9D9}
@media (max-width:359px){.slot.full b{font-size:13px}.slot.full em{font-size:9.5px}.go{padding:0 11px;font-size:15px}.tr-row{gap:4px}}
.go{flex:0 0 auto;height:56px;border-radius:999px;border:0;background:#6B3A60;color:#E3C9D9;font-family:var(--display);font-weight:800;font-size:16px;padding:0 16px;text-decoration:none;display:flex;align-items:center}
.go.live{background:#FF9EC0;color:var(--ink)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,216,107,.9)}100%{box-shadow:0 0 0 16px rgba(255,216,107,0)}}
.tray.bump{animation:pulse 1s ease-out 2}
.go.live.bump{animation:pulse 1s ease-out 3}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(58,22,48,.4);z-index:39}
.scrim[hidden]{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-top:3px solid var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(58,22,48,.28);transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;max-height:86%;overflow:auto;overscroll-behavior:contain;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.sh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-top:14px}
.sh-top h2{font-weight:800;font-stretch:82%;font-size:26px;line-height:1;min-width:0}
.sh-top small{display:block;font-family:var(--body);font-stretch:100%;font-size:14px;font-weight:700;color:var(--muted);margin-top:4px}
.bigcap{border-radius:18px;padding:12px 14px;margin-top:12px;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.sheet ul{margin:10px 0 0;padding-left:20px}
.sheet li{margin:6px 0}
.src{font-size:13px;color:var(--muted);font-weight:700;margin-top:10px}
.fitline{font-weight:800;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.lstrip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:6px}
@media (min-width:520px){.lstrip{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lstrip div{display:flex;align-items:center;justify-content:space-between;gap:4px;border-radius:12px;padding:6px 6px;background:var(--paper);font-size:12px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;min-width:0}
.lstrip div span{min-width:0}
.lstrip div.zero{background:#FFE3E1;color:var(--coral-ink)}
.lstrip i{font-style:normal;font-family:var(--display);font-size:16px}
.lim{display:grid;gap:2px;padding:8px 0 6px;border-top:2px solid var(--line)}
.lim label{font-family:var(--display);font-weight:800;font-size:18px}
.lim output{font-weight:700;color:var(--muted);font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:var(--rose)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:32px;height:32px;border-radius:50%;background:var(--berry);border:3px solid var(--white);box-shadow:0 0 0 2px var(--ink);margin-top:-11px}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:var(--rose)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--berry);border:3px solid var(--white);box-shadow:0 0 0 2px var(--ink)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tray-h,130px) + 6px);transform:translateX(-50%);background:var(--white);color:var(--ink);padding:10px 16px;border-radius:18px;font-weight:800;font-size:15px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;width:max-content;max-width:92%;text-align:center;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--berry)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}.tray.bump,.go.live.bump{animation:none}}
@media (min-width:600px){.two{grid-template-columns:1fr 1fr}.tiles3{grid-template-columns:repeat(3,1fr)}}

/* ---------- Back line ---------- */
.trail{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--line)}
.trail[hidden]{display:none}
.trail .wrap{display:flex;align-items:center;gap:8px;min-height:58px}
.trail .bk{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--white);display:grid;place-items:center}
.trail .path{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:800;font-stretch:85%;font-size:14.5px;white-space:nowrap;overflow:hidden}
.trail .path a{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:13px 1px;text-decoration:underline;text-decoration-color:var(--berry);text-decoration-thickness:2px;text-underline-offset:4px}
.trail .path a:first-child{flex:0 0 auto;min-width:44px;text-align:center}
.trail .path a:nth-of-type(2):not(:last-of-type){flex-shrink:6}
.trail .path span{flex:0 0 auto;color:var(--muted)}

/* ---------- Footer ---------- */
.foot{margin-top:30px;font-size:13.5px;font-weight:700;color:var(--muted);text-align:center}
.foot ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px}
.foot .link{color:var(--muted)}
.loading{padding:40px 16px;text-align:center;font-weight:800}

/* ---- Experience marker: the map's shape and colour, used wherever an experience is named ---- */
.ymk{display:inline-block;flex:0 0 auto;vertical-align:-.12em;margin-right:.3em;overflow:visible}
h1 .ymk,h3 .ymk{vertical-align:-.04em}
.trail .path a .ymk{vertical-align:-2px;margin-right:4px}
.lstrip div span .ymk{margin-right:3px}
.gtk{font-size:14px;line-height:1.35;color:var(--muted);font-weight:600;overflow-wrap:anywhere;border-left:3px solid var(--line);padding:1px 0 1px 9px}
.gtk b{color:var(--ink);font-weight:800}
.gtk.box{background:var(--white);border:2px solid var(--line);border-radius:18px;padding:10px 14px;color:var(--ink);font-weight:400;font-size:15px}
.gtk.box h4{font-weight:800;font-size:17px}
.gtk.box ul{margin:6px 0 0;padding-left:20px}
.gtk.box li{margin:5px 0}
.gtk.box .ask{display:block;color:var(--muted);font-weight:600;font-size:14px}
small.gtkc{display:block;margin-top:6px;padding-top:5px;border-top:1.5px dashed var(--line);font-weight:600}
/* ---- rows that open in place ---- */
.rowd{background:var(--white);border:2px solid var(--line);border-radius:16px;margin-top:6px}
.rowd[open]{border-color:var(--ink)}
.rowd>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) 20px;align-items:center;column-gap:8px;min-height:48px;padding:5px 12px 6px;cursor:pointer}
.rowd>summary::-webkit-details-marker{display:none}
.rl{grid-column:1;font-size:12.5px;font-weight:800;line-height:1.25;color:var(--berry-deep)}
.rh{grid-column:1;font-family:var(--display);font-weight:800;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{grid-column:1;font-size:13.5px;font-weight:600;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-top:1px}
.rowd[open]>summary .rh{white-space:normal}
.chev{grid-column:2;grid-row:1 / span 3;width:10px;height:10px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg);justify-self:center;margin-top:-4px}
.rowd[open]>summary .chev{transform:rotate(225deg);margin-top:4px}
.rb{padding:2px 12px 12px;overflow-wrap:anywhere}
.rb>ul{margin:4px 0 0;padding-left:20px}
.rb>ul>li{margin:4px 0}
.rb .amen{margin-top:4px}
.rb .panel+.panel{margin-top:0}
.rb .callbox{background:none;border:0;padding:0}
.rb .pairbox{margin-top:0}
.rb .receipt{margin-top:8px}
#view .sec{margin-top:16px}
#view .sec.head{margin-top:12px}
.ph1{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:clamp(28px,8vw,36px);line-height:1}
.ph1.pu{font-size:26px;line-height:1.05}
.psub{font-size:16px;line-height:1.35;margin-top:6px}
.h2s{font-size:24px!important;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.h2s .fig{font-family:var(--body);font-stretch:100%;font-size:15px;font-weight:800;text-align:right}
.h2s .fig .rng{font-size:12.5px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badges:empty{display:none}
.chips{display:flex;gap:6px;margin-top:2px}
.sec.head .chips{margin-top:8px}
.chip{flex:1 1 0;min-width:0;background:var(--paper);border-radius:12px;padding:5px 6px 6px}
.chip b{display:block;font-family:var(--display);font-weight:800;font-size:15.5px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{display:block;font-size:11px;font-weight:700;line-height:1.2;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.wide{flex:1.5 1 0}
.hood.card .safest{font-size:12px;padding:1px 9px}
.chip.good{background:#E3F6EE}
.chip.good b,.chip.good small{color:var(--mint-ink)}
.unit .chip small,.hood .chip small{color:var(--muted)}
.l2{font-size:15px;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.life.slim{display:grid;gap:7px;padding:12px 14px 12px;border-radius:22px;box-shadow:4px 4px 0 var(--berry)}
.life.slim h3{font-size:clamp(22px,6.4vw,26px);line-height:1.02}
.life.slim .foot{margin-top:0}
.life.slim .enter{padding:5px 12px;font-size:14.5px}
.life.slim.none>*:not(.foot){opacity:.6}
.hood.card{gap:7px;padding:10px 12px 12px}
.hood.card>*{min-width:0}
.hood.card .hd>div{min-width:0}
.hood.card .hd{align-items:flex-start}
.hood.card .hd>div{flex:1 1 auto}
.hood.card .hd .pick{flex:0 0 auto}
.hood.card h3{font-size:20px}
.hood.card small{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit.card{padding:0;gap:0}
.cardl{display:grid;gap:7px;padding:10px 12px 12px;text-decoration:none;min-width:0}
.cardl .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cardl .hd>div{min-width:0}
.cardl>*{min-width:0}
.cardl .hd>div{flex:1 1 auto;overflow-wrap:anywhere}
.cardl .hd .pick{flex:0 0 auto}
.unit.card{min-width:0}
.cardl h3{font-size:19px;line-height:1.1}
.cardl small{font-size:13px}
.unit.page{border-width:3px}
.clamp{overflow:hidden}
.clamp.c4{max-height:calc(4 * 1.45em)}
.host .clamp.c4{max-height:calc(4 * 1.4 * 15.5px)}
.clamp.all{max-height:none!important}
.clamp>*+*{margin-top:6px}
.morel{display:inline-block;min-height:44px;padding:8px 0 0;font-size:14.5px}
.clampw{min-width:0}
.nextl{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;margin-top:16px;padding:6px 14px;border:2px dashed var(--berry);border-radius:16px;background:var(--blush);text-decoration:none}
.nextl small{font-size:13px;font-weight:800;color:var(--berry-deep);flex:0 0 auto}
.nextl b{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.15;text-align:right;min-width:0}
.morectl{margin-top:10px}
.morebtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.footrow{display:flex;flex-wrap:wrap;justify-content:center;gap:0 18px}
.footrow .link{min-height:44px;font-size:13.5px}
.foot #foothow{text-align:left;margin-top:4px}
.foot{margin-top:18px}
.figs.one{margin-top:4px}
.colhs{margin-top:4px}
.tour-list{margin-top:16px;padding:12px 14px}
.viewsw{margin-top:8px}
.rl{text-transform:uppercase;letter-spacing:.04em;font-size:11.5px}
.st{font-style:normal;text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.st.ask{background:var(--butter);color:var(--ink)}
.st.ok{background:#E3F6EE;color:var(--mint-ink)}
.rowstop{display:flex;justify-content:flex-end;margin:-10px 0 -8px}

/* ---- Map component (docs/MAP_COMPONENT.md), pasted from site/map_component.html ---- */
.hhm{--hhm-ink:var(--ink,#3A1630);--hhm-muted:var(--muted,#7A5670);--hhm-line:var(--line,#F3CADA);--hhm-paper:var(--paper,#FFF4F7);--hhm-white:var(--white,#fff);
  --hhm-water:#D7E4EA;--hhm-water-ink:#5B7C8C;--hhm-land:#FFFAF6;--hhm-coast:#C9B4BF;
  font-family:var(--body,"Figtree","Segoe UI",system-ui,sans-serif);color:var(--hhm-ink);display:grid;gap:8px;min-width:0}
.hhm *{box-sizing:border-box}
.hhm button{font:inherit;color:inherit;cursor:pointer}
.hhm :focus-visible{outline:3px solid var(--hhm-ink);outline-offset:2px;border-radius:10px}
.hhm-seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2px solid var(--hhm-ink);border-radius:999px;background:var(--hhm-white);padding:2px}
.hhm-seg button{min-height:44px;border:0;border-radius:999px;background:transparent;font-weight:800;font-size:14px;line-height:1.1;padding:4px 8px}
.hhm-seg button[aria-pressed="true"]{background:var(--hhm-ink);color:#fff}
.hhm-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hhm-chip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:5px;min-height:44px;min-width:0;padding:4px 6px 4px 5px;border-radius:16px;border:2px solid var(--hhm-line);background:var(--hhm-white);font-weight:800;font-size:12.5px;line-height:1.15;text-align:left}
.hhm-chip svg{flex:0 0 auto;width:18px;height:18px;overflow:visible}
.hhm-chip small{font-weight:700;font-size:12px;color:var(--hhm-muted)}
.hhm-chip[aria-pressed="true"]{border-color:var(--hhm-ink);background:var(--hhm-ink);color:#fff}
.hhm-chip[aria-pressed="true"] small{color:#F3DDE8}
.hhm-chip[aria-pressed="true"] svg path{stroke:#fff}
.hhm-chips.has-on .hhm-chip[aria-pressed="false"]{opacity:.62}
.hhm-stage{position:relative;border:2px solid var(--hhm-line);border-radius:22px;overflow:hidden;background:var(--hhm-water)}
.hhm-svg{display:block;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:grab}
.hhm-svg.zoomed{touch-action:none}
.hhm-svg.dragging{cursor:grabbing}
.hhm-svg.over-dot{cursor:pointer}
.hhm-svg:focus{outline:0}
.hhm-land{fill:var(--hhm-land);stroke:var(--hhm-coast);stroke-width:1;stroke-linejoin:round}
.hhm-boro{stroke:none}
.hhm-cline{fill:none;stroke:#E6D6DC;stroke-width:1}
.hhm-sline{fill:none;stroke:#B79FAB;stroke-width:1.5;stroke-dasharray:5 4}
.hhm-geo path{vector-effect:non-scaling-stroke}
.hhm-lab{font-weight:800;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.hhm-lab.water{fill:var(--hhm-water-ink);stroke:none;font-style:italic;font-weight:600;font-size:11px;letter-spacing:.04em}
.hhm-lab.state{fill:#A58E9B;stroke:var(--hhm-land);stroke-width:3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.hhm-lab.boro{fill:#8C7483;stroke:var(--hhm-land);stroke-width:3px;font-size:11px}
.hhm-lab.name{fill:var(--hhm-ink);stroke:#fff;stroke-width:3.5px;font-size:11.5px}
.hhm-lab.name.sel{font-size:13px}
.hhm-lab.home{fill:var(--hhm-ink);stroke:#fff;stroke-width:4px;font-size:13px}
.hhm-dot{cursor:pointer;outline:0;transition:opacity .18s}
.hhm-dot .m{stroke:#fff;stroke-width:1.5;stroke-linejoin:round}
.hhm-dot.none .m{fill:#fff!important;stroke-width:2.2}
.hhm.mode-drive .hhm-dot .m{stroke:var(--hhm-ink);stroke-width:1.1}
.hhm.mode-drive .hhm-dot.none .m{stroke-dasharray:2.5 2}
.hhm-dot.dim{opacity:.16}
.hhm-dot.sel .m{stroke:var(--hhm-ink);stroke-width:2.6}
.hhm-ring{fill:none;stroke:var(--hhm-ink);stroke-width:3;pointer-events:none}
.hhm-ring.w{stroke:#fff;stroke-width:6}
.hhm-zoom{position:absolute;top:8px;right:8px;display:grid;gap:6px}
.hhm-zoom button{width:44px;height:44px;border-radius:14px;border:2px solid var(--hhm-ink);background:var(--hhm-white);font-weight:800;font-size:22px;line-height:1;display:grid;place-items:center;padding:0}
.hhm-zoom button[disabled]{opacity:.4;cursor:default}
.hhm-reset{position:absolute;left:8px;top:8px;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--hhm-ink);background:var(--hhm-ink);color:#fff!important;font-weight:800;font-size:14px}
.hhm-reset[hidden]{display:none}
.hhm-regions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-weight:800}
.hhm-regions span{color:var(--hhm-muted)}
.hhm-regions button{min-height:44px;padding:0 12px;border-radius:999px;border:2px solid var(--hhm-line);background:var(--hhm-paper);font-weight:800;font-size:13px}
.hhm-legend{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px;font-weight:700;color:var(--hhm-muted)}
.hhm-legend b{color:var(--hhm-ink);font-weight:800}
.hhm-legend .k{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hhm-legend i{width:14px;height:14px;border-radius:50%;border:1.2px solid var(--hhm-ink);flex:0 0 auto;display:inline-block}
.hhm-legend svg{width:30px;height:22px;flex:0 0 auto;overflow:visible}
.hhm-hint{font-size:13px;font-weight:700;color:var(--hhm-muted);margin:0}
.hhm-card{position:relative;background:var(--hhm-white);border:2px solid var(--hhm-ink);border-radius:22px;padding:12px 14px 14px;min-height:64px}
.hhm-card.empty{border-color:var(--hhm-line);border-style:dashed;display:grid;align-items:center}
.hhm-card h3{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:800;font-size:22px;line-height:1.1;margin:2px 52px 0 0}
.hhm-card h3 span{font-family:var(--body,system-ui,sans-serif);font-size:13px;font-weight:800;color:var(--hhm-muted);margin-left:4px}
.hhm-yr{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;margin:0 52px 0 0}
.hhm-yr svg{width:16px;height:16px;flex:0 0 auto;overflow:visible}
.hhm-x{position:absolute;top:6px;right:6px;width:44px;height:44px;border:0;background:transparent;font-size:24px;font-weight:800;line-height:1;border-radius:50%}
.hhm-facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.hhm-facts li{background:var(--hhm-paper);border-radius:14px;padding:8px 10px;min-width:0}
.hhm-facts b{display:block;font-family:var(--display,system-ui,sans-serif);font-weight:800;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.hhm-facts b.words{font-size:14px;line-height:1.2}
.hhm-facts small{display:block;font-size:12px;font-weight:700;color:var(--hhm-muted);line-height:1.25;margin-top:2px}
.hhm-crime{margin:10px 0 0;display:grid;gap:8px}
.hhm-crime p{margin:0;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.hhm-crime p b{font-weight:800;font-variant-numeric:tabular-nums}
.hhm-crime p span{color:var(--hhm-muted);white-space:nowrap}
.hhm-bar{position:relative;height:10px;border-radius:5px;background:#F1E4EA;margin-top:3px}
.hhm-bar u{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--hhm-ink);text-decoration:none}
.hhm-bar s{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:var(--berry-deep,#C12C62);border-radius:2px;text-decoration:none}
.hhm-none{font-size:13px;font-weight:700;color:var(--hhm-muted);margin:10px 0 0}
.hhm-go{margin-top:12px;width:100%;min-height:48px;border-radius:999px;border:2px solid var(--hhm-ink);background:var(--berry-deep,#C12C62);color:#fff!important;font-family:var(--display,system-ui,sans-serif);font-weight:800;font-size:17px}
.hhm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* page: chips say "Walk-Everywhere" on a phone and the whole name where there is room; rank pill on the card */
.hhm .hhm-chip{grid-template-columns:18px minmax(0,1fr);grid-template-rows:auto auto;column-gap:4px;row-gap:0;padding:4px 4px;font-weight:800;font-size:clamp(11px,3.1vw,12.5px);line-height:1.15}
.hhm-chip svg{grid-column:1;grid-row:1;align-self:end}
.hhm-chip>span{grid-column:2;grid-row:1/3;min-width:0}
.hhm .hhm-chip small{grid-column:1;grid-row:2;align-self:start;text-align:center;font-size:11px;line-height:1.1}
.hhm-chip .hhm-full{display:none}
.hhm .hhm-reset{font-weight:800;font-size:14px}
.hhm .hhm-x{font-size:24px;font-weight:800;line-height:1}
.hhm .hhm-go{font-family:var(--display,system-ui,sans-serif);font-weight:800;font-size:17px}
.hhm-rank{margin-left:auto;flex:0 0 auto;font-size:12.5px;font-weight:800;border:2px solid var(--hhm-ink);border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--hhm-white)}
.hhm-rank.top{background:var(--butter,#FFD86B)}
.hhm-yr>span:first-of-type{min-width:0}
@media (max-width:359px){.hhm-chips{grid-template-columns:1fr 1fr}}
@media (min-width:520px){.hhm .hhm-chip{padding:4px 8px;column-gap:6px;font-size:12.5px}.hhm-chip .hhm-full{display:inline}.hhm-chip .hhm-short{display:none}}
@media (max-width:359px){.hhm-facts{grid-template-columns:1fr 1fr}.hhm-facts li:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.hhm-dot{transition:none}}
/* ---- polish pass: slim bottom bar, headlines in full, one asterisk line, tiles ---- */
body{padding-bottom:calc(var(--tray-h,56px) + 20px)}
.tray{border-radius:18px 18px 0 0}
.tray .wrap{padding-top:0;padding-bottom:env(safe-area-inset-bottom,0px);gap:0}
.tr-head{display:flex;align-items:center;gap:10px}
.tr-tog{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;min-height:54px;background:none;border:0;color:#fff;padding:0;text-align:left;cursor:pointer}
.tray.open .tr-tog{min-height:44px}
.tr-tog b{font-family:var(--script);font-weight:400;font-size:23px;color:#FF9EC0;line-height:1;white-space:nowrap}
.tr-tog span{font-size:14px;font-weight:800;color:#F3DDE8;white-space:nowrap}
.tr-tog .chev{margin:0 4px 4px auto;border-color:#F3DDE8;transform:rotate(225deg);flex:0 0 auto}
.tray.open .tr-tog .chev{transform:rotate(45deg);margin-bottom:6px}
.tr-row{padding-bottom:10px}
.tr-row[hidden]{display:none}
.tray .slot,.tray .tr-row .go{height:50px}
.go.sm{height:40px;font-size:15px;padding:0 14px}
.go[aria-disabled="true"]{opacity:.7}
.toast{bottom:calc(var(--tray-h,56px) + 6px)}
.rowd{scroll-margin-top:64px}
.rh{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.starline{display:flex;align-items:center;gap:6px;width:100%;min-height:44px;text-align:left;background:#FFF3C9;border:2px solid var(--ink);border-radius:14px;padding:4px 12px;font-size:14.5px;font-weight:800;line-height:1.25;color:var(--ink);cursor:pointer}
.starline b{font-family:var(--display);font-size:20px;line-height:1;color:var(--berry-deep)}
.starline span{flex:1 1 auto;min-width:0}
.starline .chev{flex:0 0 auto;margin:-4px 2px 0 0;width:9px;height:9px}
/* ---- the tutorial ("How this works"): a card over the first screen on a first visit; the same card from the two "How this works" buttons ---- */
.tutscrim{position:fixed;inset:0;background:rgba(58,22,48,.6);z-index:60;touch-action:none}
.tutscrim[hidden],.tut[hidden]{display:none}
.tut{position:fixed;inset:0;z-index:61;display:grid;place-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.tutcard{pointer-events:auto;width:100%;max-width:430px;max-height:100%;grid-template-rows:auto 1fr auto auto;overflow:auto;overscroll-behavior:contain;background:var(--white);border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--berry);padding:12px 14px 14px;display:grid;gap:10px;animation:tutin .22s ease-out}
@keyframes tutin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tut-top{display:flex;align-items:center;gap:8px}
.tut-top svg{width:38px;height:38px;flex:0 0 auto}
.tut-top h2{flex:1 1 auto;min-width:0;font-family:var(--script);font-weight:400;font-size:28px;line-height:1;color:var(--berry-deep)}
.tut-top .btn{flex:0 0 auto}
.tut-step{display:grid;gap:6px;align-content:start}
.tut-art{--t-s:14px;--t-m:16px;--t-l:19px;background:var(--blush);border:2px solid var(--line);border-radius:18px;min-height:176px;padding:12px 10px;display:grid;align-content:center;justify-items:center;gap:8px;overflow:hidden;font-size:14px;line-height:1.25}
.tut-art>*{max-width:100%;min-width:0}
.tut-count{font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--berry-deep);margin-top:4px}
.tut-step h3{font-weight:800;font-stretch:82%;font-size:24px;line-height:1.05}
.tut-step .tut-p{font-size:16px;line-height:1.4;min-height:5.6em}
.tut-step .tut-p b{font-family:var(--display);font-weight:800}
.tut-dots{display:flex;justify-content:center;gap:7px}
.tut-dots i{width:10px;height:10px;border-radius:50%;background:#E9B9CC}
.tut-dots i.on{background:var(--berry-deep);width:22px;border-radius:999px}
.tut-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tut-acts .btn{min-height:48px;width:100%}
.tut-acts .btn[hidden]{display:none}

      (dots.some(function(d){return !d.n})?'<span class="k"><svg viewBox="0 0 22 22" style="width:16px" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="#fff" stroke="#7A5670" stroke-width="2.4"'+(state.mode==="drive"?' stroke-dasharray="3 2.4"':'')+'/></svg>'+(state.mode==="drive"?'Dashed outline':'Hollow')+': no apartments shown</span>':'');

  function roving(){

        '<div class="hhm-bar" aria-hidden="true"><u style="width:'+Math.max(1.5,v/max*100).toFixed(1)+'%"></u>'+(ref!=null?'<s style="left:'+(ref/max*100).toFixed(1)+'%"></s>':'')+'</div></div>'}
    /* page: rank within its experience, and the count against the viewer's limits when the page passes places_all */

      '<ul class="hhm-facts"><li><b>'+(lim?d.n+' of '+all:d.n)+'</b><small>'+(lim?'apartments match your filters':d.n===1?'apartment shown':'apartments shown')+'</small></li>'+
      (h.price?'<li class="hhm-price">'+esc(h.price)+'</li>':'')+ /* page: the two prices, rent and total, as one line */
      '<li>'+(dm!=null?'<b>'+Math.round(dm)+' min</b><small>by car to '+esc(anchorLabel)+'</small>':'<b class="words">Drive time not known</b>')+'</li>'+
      '<li>'+toll+'</li></ul>'+

  /* ---------- pointer: drag, pinch, tap ---------- */

      var gx=drag.cx+(drag.mx-state.W/2)/(state.s0*drag.k),gy=drag.cy+(drag.my-state.H/2)/(state.s0*drag.k);

<script>
(function(){
"use strict";

/* =====================================================================================================
   TINT RULES: the one table that decides the colour of every day tile.
   Each tile reads real numbers from unit.moments (and unit.vs_queens for Sunday).
     s = Strong   m = Mixed   y = Your call   u = Not known yet (the deciding input is null)
   Nothing here ranks one place against another; a tint only says which side of a fixed line a number is on.

   Tile        Deciding inputs                                   Strong (s) when                          Not known (u) when
   ----------  ------------------------------------------------  ---------------------------------------  -------------------------
   Wake up     wake.park_walk_min                                walk to green space <= 5 minutes         park_walk_min is null
   Work        work.sqft, work.separate_bedroom                  a separate bedroom AND >= 650 sq ft       sqft is null
                                                                 (650 = the Queens median in meta)
   After work  after.restaurants_800m                            >= 20 restaurants within 800 m           restaurants_800m is null
   Night       night.violent_vs_jamaica, parking.rank            violent crime <= half of Jamaica's rate   violent_vs_jamaica is null
                                                                 AND parking rank >= 3 (covered, garage,   (parking unknown alone
                                                                 gated)                                    gives Mixed, not Strong)
   Saturday    sat.bars_1600m, sat.restaurants_1600m             >= 5 bars AND >= 25 restaurants           either count is null
                                                                 within a mile
   Sunday      vs_queens.drive_min (five-point scale; the        point >= 3: no more than 5 minutes        drive point is null
               owner said closer to Mom and Dad is better)       farther than the typical Queens place
   Everything else is Mixed (m).
   SUNDAY_BY_SCALE = false puts Sunday back to "Your call" (y) for every place, as in the mock.
   ===================================================================================================== */
var TINT={
  WAKE_WALK_MIN:5,
  WORK_SQFT:650,
  AFTER_RESTAURANTS:20,
  NIGHT_JAMAICA_RATIO:0.5,
  NIGHT_PARKING_RANK:3,
  SAT_BARS:5,
  SAT_RESTAURANTS:25,
  SUNDAY_POINT:3,
  SUNDAY_BY_SCALE:true,
  /* Weak (w): the same numbers, on the far side of a second line. Half or double the Strong line, or the bottom of the same scale. */
  WAKE_WEAK_WALK_MIN:10,     /* green space more than 10 minutes on foot (twice the Strong line) */
  WORK_WEAK:true,            /* a studio AND under WORK_SQFT (neither half of Strong) */
  AFTER_WEAK_RESTAURANTS:10, /* fewer than 10 restaurants within 800 m (half the Strong line) */
  NIGHT_WEAK_PARKING_RANK:2, /* the car sleeps on the street (parking rank known and under 2); crime never makes it Weak: every place shown passed that rule */
  SAT_WEAK_BARS:2.5,SAT_WEAK_RESTAURANTS:12.5, /* fewer than half of both Strong lines */
  SUNDAY_WEAK_POINT:1        /* the bottom point of the five-point drive scale */
};
var TINT_WORD={s:"Strong",m:"Mixed",w:"Weak",y:"Your call",u:"Not known yet"};
var NK="Not known yet";
var KEY="lamia-house-hunt-v1";
var IC_MAP='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z M9 4v13.5 M15 6.5V20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>',
    IC_LIST='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="4" cy="6" r="1.8" fill="currentColor"/><circle cx="4" cy="12" r="1.8" fill="currentColor"/><circle cx="4" cy="18" r="1.8" fill="currentColor"/></svg>';
/* Safety limit steps: violent crime relative to Jamaica (unit.moments.night.violent_vs_jamaica). */
var YEAR_COLORS=["#9AD9A8","#6FA8DC","#B79CD9","#F2A2B8","#FFD86B","#C8553D"]; /* pastel fills for the drawings only */

var YEAR_MARKS=[{color:"#4192C8",shape:"diamond"},{color:"#AA0E0E",shape:"square"},{color:"#F04288",shape:"down"},{color:"#AA42F0",shape:"plus"},{color:"#324BAE",shape:"circle"},{color:"#AA8B0E",shape:"up"}];

  if(shape==="square"){a=r*0.89;return "M"+f(-a)+" "+f(-a)+"H"+f(a)+"V"+f(a)+"H"+f(-a)+"z"}

  if(shape==="plus"){a=r*1.18;b=r*0.44;return "M"+f(-b)+" "+f(-a)+"H"+f(b)+"V"+f(-b)+"H"+f(a)+"V"+f(b)+"H"+f(b)+"V"+f(a)+"H"+f(-b)+"V"+f(b)+"H"+f(-a)+"V"+f(-b)+"H"+f(-b)+"z"}
  return "M"+f(-r)+" 0a"+f(r)+" "+f(r)+" 0 1 0 "+f(2*r)+" 0a"+f(r)+" "+f(r)+" 0 1 0 "+f(-2*r)+" 0z"}

var WALK_M_PER_MIN=80; /* 800 m is called "a 10-minute walk" throughout */

/* =====================================================================================================
   SOURCES: where a figure comes from when the data carries no link for it. Shown as "How we got this".
   Correct the wording here, in this one place.

var SOURCES={
  map:"OpenStreetMap data of 14 Nov 2026",
  drive:"OSRM free-flow routing without traffic",

/* Local rules (neighborhood.local.parking_rules / .dog_rules): plain labels, the order they are listed in,

var RULE_WORD={overnight_parking:"Overnight on the street",resident_permit:"Resident permit",guest_parking:"Guests",alternate_side:"Street cleaning",snow_emergency:"Snow",municipal_lot_overnight:"City lots overnight",municipal_garage_monthly:"City garage by the month",meter_hours:"Meter hours",meter_rates:"Meter prices",towing:"Towing",hydrant:"Hydrants",
  leash_law:"Leash",parks_and_beaches:"Parks and beaches",dog_park:"Dog park",waste:"Picking up",dog_license:"Licence",dog_limit:"How many dogs"};
var PARK_RULE_ORDER=["overnight_parking","resident_permit","guest_parking","alternate_side","snow_emergency","municipal_lot_overnight","municipal_garage_monthly","meter_hours","meter_rates","towing","hydrant"];
var DOG_RULE_ORDER=["leash_law","parks_and_beaches","dog_park","waste","dog_limit","dog_license"];
var SAT_RULES=["overnight_parking","resident_permit","guest_parking","municipal_lot_overnight"];
var WAKE_RULES=["leash_law","parks_and_beaches","dog_park","waste"];
var RULES_SHOWN=3; /* rules shown before the "more rules" fold on the neighborhood page */
var RULE_FLAG=[
  {rule:"overnight_parking",label:"Overnight street parking is restricted here",re:/\bbanned\b|not allowed|needs (a|the) permit|permit-only|may not park|overnight (parking )?permit|all-night parking restrictions/i},
